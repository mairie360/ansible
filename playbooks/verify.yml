---
# =============================================================================
# Recette d'un déploiement. À lancer après site.yml.
#
#   ansible-playbook playbooks/verify.yml
#
# Échoue si une vérification échoue : utilisable en étape de CI.
# =============================================================================

- name: "Vérification des machines Argo CD"
  hosts: "*_argocd"
  become: true
  gather_facts: false
  tasks:
    - name: Les Applications Argo CD sont Synced et Healthy
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps
      changed_when: false

    - name: Afficher l'état des Applications
      ansible.builtin.debug:
        var: apps.stdout_lines

    - name: Aucune Application en échec
      ansible.builtin.assert:
        that:
          - "'Degraded' not in apps.stdout"
          - "'Unknown' not in apps.stdout"
        fail_msg: "Applications en erreur — voir la sortie ci-dessus."

    # A sync operation that fails to generate its manifests does not end on
    # its own: Argo CD retries it on the revision it pinned when it started
    # (MAIR-173). Such an operation still reads "Running", so the status
    # check above can miss it. Flag any operation stuck on a ComparisonError
    # or running for longer than verify_stuck_sync_minutes.
    - name: No Application stuck in a sync operation
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io -o json | jq -r --argjson max "$MAX_SECONDS" '
          .items[]
          | select(.status.operationState.phase == "Running")
          | select(
              any(.status.conditions[]?; .type == "ComparisonError")
              or (now - (.status.operationState.startedAt | fromdateiso8601) > $max))
          | "\(.metadata.name): \(.status.operationState.message // "")"'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        MAX_SECONDS: "{{ (verify_stuck_sync_minutes | default(15) | int) * 60 }}"
      register: stuck_syncs
      changed_when: false

    - name: Report stuck sync operations
      ansible.builtin.assert:
        that: stuck_syncs.stdout | length == 0
        fail_msg: >-
          Stuck sync operation(s): {{ stuck_syncs.stdout_lines | join(' | ') }}.
          On this machine, run
          `sudo KUBECONFIG=/root/.kube/argocd-cli.yaml argocd app terminate-op <app> --core`,
          then let auto-sync pick up the latest commit.

    - name: The instances of the group are registered, labelled and annotated
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster,mairie360.fr/role=instance \
          -o jsonpath='{range .items[*]}{.metadata.labels.mairie360\.fr/env}{" "}{.metadata.annotations.mairie360\.fr/revision}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: registered
      changed_when: false

    - name: Every declared instance is registered
      ansible.builtin.assert:
        that:
          - hostvars[item].env_name in registered.stdout_lines | map('split', ' ') | map('first') | list
        fail_msg: >-
          Instance {{ item }} (env {{ hostvars[item].env_name }}) is not
          registered in this Argo CD. Re-run phase 3.
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

    # MAIR-346: Deploiment's bootstrap AppSets read the revision from this
    # annotation. A wrong or missing one makes cert-manager, the ingress
    # controller, sealed-secrets and cluster-addons follow the wrong branch.
    # Only the environments of deploiment_revision_annotated_envs carry it;
    # the others must not (they follow `main` until prod is promoted).
    - name: Every instance carries the expected mairie360.fr/revision
      ansible.builtin.assert:
        that:
          - (hostvars[item].env_name ~ ' ' ~ expected) | trim in registered.stdout_lines | map('trim') | list
        fail_msg: >-
          Cluster {{ hostvars[item].env_name }} should carry
          {{ ('mairie360.fr/revision=' ~ expected) if expected | length > 0 else 'no mairie360.fr/revision annotation' }}.
          Re-run `ansible-playbook playbooks/site.yml --tags labels`.
      vars:
        expected: >-
          {{ (deploiment_env_revisions[hostvars[item].env_name] | default(deploiment_repo_branch))
             if hostvars[item].env_name in deploiment_revision_annotated_envs else '' }}
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

    - name: Read the state of the promotion runner (MAIR-346)
      ansible.builtin.systemd_service:
        name: gh-runner
      register: runner_service
      when: github_runner_enabled | bool

    # "activating" is the normal state between two jobs (prepare.sh registers
    # the next runner).
    - name: The promotion runner is running
      ansible.builtin.assert:
        that: runner_service.status.ActiveState | default('missing') in ['active', 'activating']
        fail_msg: >-
          gh-runner is {{ runner_service.status.ActiveState | default('missing') }} on {{ inventory_hostname }}:
          Deploiment's Promote workflow cannot verify staging. Provide the GitHub
          App (GITHUB_RUNNER_APP_ID / GITHUB_RUNNER_APP_PRIVATE_KEY_FILE) and run
          `site.yml --tags github_runner`, then `journalctl -u gh-runner`.
      when: github_runner_enabled | bool

- name: "Vérification des instances"
  hosts: "*_instances"
  become: true
  gather_facts: false
  tasks:
    # The Deploiment checkout only lives on the Argo CD machine, which also
    # holds a kubeconfig for each instance (phase 3), with a context named
    # after the environment: run verify.sh from there.
    # MAIR-346: an environment the promotion runner verifies is checked as
    # the runner user with the runner's least-privilege kubeconfig, exactly
    # like the Promote workflow does: a missing permission shows up here
    # rather than as a blocked promotion.
    - name: Full acceptance test of the instance (Deploiment/scripts/verify.sh)
      ansible.builtin.command:
        cmd: "./scripts/verify.sh {{ env_name }} {{ env_name }} {{ instance_domain }}"
        chdir: /opt/Deploiment
      environment:
        KUBECONFIG: >-
          {{ ('/home/gh-runner/.kube/instance-' if as_runner | bool else '/root/.kube/instance-') ~ env_name ~ '.yaml' }}
        # The runner user cannot write to its home: kubectl's cache goes here.
        KUBECACHEDIR: "/tmp/verify-kube-cache-{{ env_name }}"
      become: true
      become_user: "{{ 'gh-runner' if as_runner | bool else 'root' }}"
      vars:
        argocd_machine: "{{ groups[org_group ~ '_argocd'][0] }}"
        as_runner: >-
          {{ hostvars[argocd_machine].github_runner_enabled | default(false) | bool
             and env_name in hostvars[argocd_machine].github_runner_verify_envs | default([]) }}
      delegate_to: "{{ groups[org_group ~ '_argocd'][0] }}"
      register: verify
      changed_when: false
      failed_when: false

    - name: Acceptance test output
      ansible.builtin.debug:
        var: verify.stdout_lines

    - name: Every check passed
      ansible.builtin.assert:
        that: verify.rc == 0
        fail_msg: "scripts/verify.sh failed for {{ inventory_hostname }}, see its output above."
