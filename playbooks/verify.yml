---
# =============================================================================
# Recette d'un déploiement. À lancer après site.yml.
#
#   ansible-playbook playbooks/verify.yml
#
# Échoue si une vérification échoue : utilisable en étape de CI.
# =============================================================================

- name: "Vérification des machines Argo CD"
  hosts: "*_argocd"
  become: true
  gather_facts: false
  tasks:
    - name: Les Applications Argo CD sont Synced et Healthy
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps
      changed_when: false

    - name: Afficher l'état des Applications
      ansible.builtin.debug:
        var: apps.stdout_lines

    - name: Aucune Application en échec
      ansible.builtin.assert:
        that:
          - "'Degraded' not in apps.stdout"
          - "'Unknown' not in apps.stdout"
        fail_msg: "Applications en erreur — voir la sortie ci-dessus."

    # A sync operation that fails to generate its manifests does not end on
    # its own: Argo CD retries it on the revision it pinned when it started
    # (MAIR-173). Such an operation still reads "Running", so the status
    # check above can miss it. Flag any operation stuck on a ComparisonError
    # or running for longer than verify_stuck_sync_minutes.
    - name: No Application stuck in a sync operation
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io -o json | jq -r --argjson max "$MAX_SECONDS" '
          .items[]
          | select(.status.operationState.phase == "Running")
          | select(
              any(.status.conditions[]?; .type == "ComparisonError")
              or (now - (.status.operationState.startedAt | fromdateiso8601) > $max))
          | "\(.metadata.name): \(.status.operationState.message // "")"'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        MAX_SECONDS: "{{ (verify_stuck_sync_minutes | default(15) | int) * 60 }}"
      register: stuck_syncs
      changed_when: false

    - name: Report stuck sync operations
      ansible.builtin.assert:
        that: stuck_syncs.stdout | length == 0
        fail_msg: >-
          Stuck sync operation(s): {{ stuck_syncs.stdout_lines | join(' | ') }}.
          On this machine, run
          `sudo KUBECONFIG=/root/.kube/argocd-cli.yaml argocd app terminate-op <app> --core`,
          then let auto-sync pick up the latest commit.

    - name: Les instances du groupe sont bien enregistrées et étiquetées
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster,mairie360.fr/role=instance \
          -o jsonpath='{range .items[*]}{.metadata.labels.mairie360\.fr/env}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: registered
      changed_when: false

    - name: Toutes les instances déclarées sont enregistrées
      ansible.builtin.assert:
        that:
          - hostvars[item].env_name in registered.stdout_lines
        fail_msg: >-
          L'instance {{ item }} (env {{ hostvars[item].env_name }}) n'est pas
          enregistrée dans cet Argo CD. Relancer la phase 3.
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

- name: "Vérification des instances"
  hosts: "*_instances"
  become: true
  gather_facts: false
  tasks:
    # The Deploiment checkout only lives on the Argo CD machine, which also
    # holds a kubeconfig for each instance (phase 3), with a context named
    # after the environment: run verify.sh from there.
    - name: Full acceptance test of the instance (Deploiment/scripts/verify.sh)
      ansible.builtin.command:
        cmd: "./scripts/verify.sh {{ env_name }} {{ env_name }} {{ instance_domain }}"
        chdir: /opt/Deploiment
      environment:
        KUBECONFIG: "/root/.kube/instance-{{ env_name }}.yaml"
      delegate_to: "{{ groups[org_group ~ '_argocd'][0] }}"
      register: verify
      changed_when: false
      failed_when: false

    - name: Acceptance test output
      ansible.builtin.debug:
        var: verify.stdout_lines

    - name: Every check passed
      ansible.builtin.assert:
        that: verify.rc == 0
        fail_msg: "scripts/verify.sh failed for {{ inventory_hostname }}, see its output above."

# =============================================================================
# GDPR configuration of the machines (MAIR-293, epic MAIR-284). Read-only.
#
# Every check below that fails is a gap. The play fails on any gap that is not
# listed in `gdpr_allowed_gaps` (group_vars) with its reason: a known gap is
# tracked there, never silently ignored. The decisions come from the Deploiment
# checkout of the group's Argo CD machine (/opt/Deploiment/compliance/<org_id>/,
# MAIR-294).
# =============================================================================

- name: "GDPR configuration of the machines"
  hosts: "*_argocd:*_instances"
  become: true
  gather_facts: false
  vars:
    compliance_dir: "/opt/Deploiment/compliance/{{ org_id }}"
    argocd_host: "{{ groups[org_group ~ '_argocd'][0] }}"
  tasks:
    - name: Read the access decisions of the mairie (Deploiment compliance/)
      ansible.builtin.command: "cat {{ compliance_dir }}/access.yaml"
      delegate_to: "{{ argocd_host }}"
      register: access_file
      changed_when: false
      failed_when: false

    - name: Read the retention decisions of the mairie (Deploiment compliance/)
      ansible.builtin.command: "cat {{ compliance_dir }}/retention.yaml"
      delegate_to: "{{ argocd_host }}"
      register: retention_file
      changed_when: false
      failed_when: false

    - name: Read this machine's WireGuard public key
      ansible.builtin.command: cat /etc/wireguard/public.key
      register: wg_self_key
      changed_when: false
      failed_when: false

    - name: Collect the GDPR-relevant state of the machine
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "auditd=$(systemctl is-active auditd 2>/dev/null || true)"
          sshd -T 2>/dev/null | awk '$1=="passwordauthentication"||$1=="permitrootlogin"{print $1"="$2}'
          # A public rule for 22 is one without "on wg0".
          ufw status 2>/dev/null | grep -E '^22(/tcp)? ' | grep -vq ' on wg0' && echo "public_ssh=open" || echo "public_ssh=closed"
          echo "secrets_encryption=$(k3s secrets-encrypt status 2>/dev/null | awk -F': *' '/Encryption Status/{print $2}')"
          echo "unattended_upgrades=$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Periodic::Unattended-Upgrade /{print $2}')"
          echo "disk_encrypted=$(lsblk -no TYPE 2>/dev/null | grep -qx crypt && echo yes || echo no)"
          echo "journald_retention=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -F= '/^MaxRetentionSec=/{v=$2} END{print v}')"
          for f in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
            [ -f "$f" ] && ssh-keygen -lf "$f" 2>/dev/null | awk '{print "ssh_key="$2}'
          done
          wg show wg0 peers 2>/dev/null | sed 's/^/wg_peer=/'
      args:
        executable: /bin/bash
      register: gdpr_state
      changed_when: false

    - name: Collect the Argo CD accounts
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get configmap argocd-cm -o json \
          | jq -r '.data // {} | keys[] | select(startswith("accounts.")) | select(endswith(".enabled") | not) | ltrimstr("accounts.")'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_accounts
      changed_when: false
      when: inventory_hostname in groups[org_group ~ '_argocd']

    - name: Compute the GDPR gaps of the machine
      ansible.builtin.set_fact:
        gdpr_gaps: "{{ lookup('ansible.builtin.template', 'gdpr_gaps.j2') | from_yaml }}"
      vars:
        state: "{{ gdpr_state.stdout_lines | map('split', '=', 1) | list }}"
        access: "{{ (access_file.stdout | default('') | from_yaml) if access_file.rc == 0 else None }}"
        retention: "{{ (retention_file.stdout | default('') | from_yaml) if retention_file.rc == 0 else None }}"
        group_wg_keys: "{{ groups[org_group ~ '_argocd'] + groups[org_group ~ '_instances'] | default([]) }}"

    - name: Report the GDPR gaps
      ansible.builtin.debug:
        msg: "{{ item.id }}: {{ item.message }}{{ ' (allowed: ' ~ gdpr_allowed_gaps[item.id] ~ ')' if item.id in gdpr_allowed_gaps else '' }}"
      loop: "{{ gdpr_gaps }}"
      loop_control:
        label: "{{ item.id }}"

    - name: No GDPR gap outside the allowed ones
      ansible.builtin.assert:
        that: gdpr_gaps | rejectattr('id', 'in', gdpr_allowed_gaps | list) | list | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: {{ gdpr_gaps | rejectattr('id', 'in', gdpr_allowed_gaps | list) | map(attribute='id') | join(', ') }}.
          Fix them, or list each in gdpr_allowed_gaps (group_vars) with its reason.
