---
# =============================================================================
# Recette d'un déploiement. À lancer après site.yml.
#
#   ansible-playbook playbooks/verify.yml
#
# Échoue si une vérification échoue : utilisable en étape de CI.
# =============================================================================

- name: "Vérification des machines Argo CD"
  hosts: "*_argocd"
  become: true
  gather_facts: false
  tasks:
    - name: Les Applications Argo CD sont Synced et Healthy
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps
      changed_when: false

    - name: Afficher l'état des Applications
      ansible.builtin.debug:
        var: apps.stdout_lines

    - name: Aucune Application en échec
      ansible.builtin.assert:
        that:
          - "'Degraded' not in apps.stdout"
          - "'Unknown' not in apps.stdout"
        fail_msg: "Applications en erreur — voir la sortie ci-dessus."

    # A sync operation that fails to generate its manifests does not end on
    # its own: Argo CD retries it on the revision it pinned when it started
    # (MAIR-173). Such an operation still reads "Running", so the status
    # check above can miss it. Flag any operation stuck on a ComparisonError
    # or running for longer than verify_stuck_sync_minutes.
    - name: No Application stuck in a sync operation
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io -o json | jq -r --argjson max "$MAX_SECONDS" '
          .items[]
          | select(.status.operationState.phase == "Running")
          | select(
              any(.status.conditions[]?; .type == "ComparisonError")
              or (now - (.status.operationState.startedAt | fromdateiso8601) > $max))
          | "\(.metadata.name): \(.status.operationState.message // "")"'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        MAX_SECONDS: "{{ (verify_stuck_sync_minutes | default(15) | int) * 60 }}"
      register: stuck_syncs
      changed_when: false

    - name: Report stuck sync operations
      ansible.builtin.assert:
        that: stuck_syncs.stdout | length == 0
        fail_msg: >-
          Stuck sync operation(s): {{ stuck_syncs.stdout_lines | join(' | ') }}.
          On this machine, run
          `sudo KUBECONFIG=/root/.kube/argocd-cli.yaml argocd app terminate-op <app> --core`,
          then let auto-sync pick up the latest commit.

    - name: The instances of the group are registered, labelled and annotated
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster,mairie360.fr/role=instance \
          -o jsonpath='{range .items[*]}{.metadata.labels.mairie360\.fr/env}{" "}{.metadata.annotations.mairie360\.fr/revision}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: registered
      changed_when: false

    - name: Every declared instance is registered
      ansible.builtin.assert:
        that:
          - hostvars[item].env_name in registered.stdout_lines | map('split', ' ') | map('first') | list
        fail_msg: >-
          Instance {{ item }} (env {{ hostvars[item].env_name }}) is not
          registered in this Argo CD. Re-run phase 3.
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

    # MAIR-346: Deploiment's bootstrap AppSets read the revision from this
    # annotation. A wrong or missing one makes cert-manager, the ingress
    # controller, sealed-secrets and cluster-addons follow the wrong branch.
    # Only the environments of deploiment_revision_annotated_envs carry it;
    # the others must not (they follow `main` until prod is promoted).
    - name: Every instance carries the expected mairie360.fr/revision
      ansible.builtin.assert:
        that:
          - (hostvars[item].env_name ~ ' ' ~ expected) | trim in registered.stdout_lines | map('trim') | list
        fail_msg: >-
          Cluster {{ hostvars[item].env_name }} should carry
          {{ ('mairie360.fr/revision=' ~ expected) if expected | length > 0 else 'no mairie360.fr/revision annotation' }}.
          Re-run `ansible-playbook playbooks/site.yml --tags labels`.
      vars:
        expected: "{{ hostvars[item].deploiment_bootstrap_revision }}"
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

    - name: Read the state of the promotion runner (MAIR-346)
      ansible.builtin.systemd_service:
        name: gh-runner
      register: runner_service
      when: github_runner_enabled | bool

    # "activating" is the normal state between two jobs (prepare.sh registers
    # the next runner).
    - name: The promotion runner is running
      ansible.builtin.assert:
        that: runner_service.status.ActiveState | default('missing') in ['active', 'activating']
        fail_msg: >-
          gh-runner is {{ runner_service.status.ActiveState | default('missing') }} on {{ inventory_hostname }}:
          Deploiment's Promote workflow cannot verify staging. Provide the GitHub
          App (GITHUB_RUNNER_APP_ID / GITHUB_RUNNER_APP_PRIVATE_KEY_FILE) and run
          `site.yml --tags github_runner`, then `journalctl -u gh-runner`.
      when: github_runner_enabled | bool

- name: "Vérification des instances"
  hosts: "*_instances"
  become: true
  gather_facts: false
  tasks:
    # The Deploiment checkout only lives on the Argo CD machine, which also
    # holds a kubeconfig for each instance (phase 3), with a context named
    # after the environment: run verify.sh from there.
    # MAIR-346: an environment the promotion runner verifies is checked as
    # the runner user with the runner's least-privilege kubeconfig, exactly
    # like the Promote workflow does: a missing permission shows up here
    # rather than as a blocked promotion.
    - name: Full acceptance test of the instance (Deploiment/scripts/verify.sh)
      ansible.builtin.command:
        cmd: "./scripts/verify.sh {{ env_name }} {{ env_name }} {{ instance_domain }}"
        chdir: /opt/Deploiment
      environment:
        KUBECONFIG: >-
          {{ ('/home/gh-runner/.kube/instance-' if as_runner | bool else '/root/.kube/instance-') ~ env_name ~ '.yaml' }}
        # The runner user cannot write to its home: kubectl's cache goes here.
        KUBECACHEDIR: "/tmp/verify-kube-cache-{{ env_name }}"
      become: true
      become_user: "{{ 'gh-runner' if as_runner | bool else 'root' }}"
      vars:
        argocd_machine: "{{ groups[org_group ~ '_argocd'][0] }}"
        as_runner: >-
          {{ hostvars[argocd_machine].github_runner_enabled | default(false) | bool
             and env_name in hostvars[argocd_machine].github_runner_verify_envs | default([]) }}
      delegate_to: "{{ groups[org_group ~ '_argocd'][0] }}"
      register: verify
      changed_when: false
      failed_when: false

    - name: Acceptance test output
      ansible.builtin.debug:
        var: verify.stdout_lines

    - name: Every check passed
      ansible.builtin.assert:
        that: verify.rc == 0
        fail_msg: "scripts/verify.sh failed for {{ inventory_hostname }}, see its output above."

# =============================================================================
# State of the machines (MAIR-242). Read-only. Fails on any gap; the rules are
# in templates/machine_gaps.j2 and pinned by tests/machine_gaps_test.yml.
# unattended-upgrades and the k3s secrets encryption are checked by the GDPR
# play below.
# =============================================================================

- name: "State of the machines (firewall, WireGuard, k3s, Cilium, fail2ban, swap)"
  hosts: "*_argocd:*_instances"
  become: true
  gather_facts: false
  vars:
    max_handshake_age: "{{ verify_wg_handshake_max_seconds | default(600) }}"
  tasks:
    - name: Collect the state of the machine
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "ufw_status=$(ufw status | awk 'NR==1{print $2}')"
          echo "ufw_default_incoming=$(ufw status verbose | awk '/^Default:/{print $2}')"
          # Rules open to everyone: "80/tcp ALLOW Anywhere" (the wg0 ones read "22/tcp on wg0 ALLOW ...").
          echo "ufw_public_ports=$(ufw status | awk '$2=="ALLOW" && $3=="Anywhere" && $1 ~ /^[0-9]/ {print $1}' | sort -u | paste -sd, -)"
          now=$(date +%s)
          wg show wg0 latest-handshakes 2>/dev/null | while read -r _ ts; do echo "wg_handshake_age=$((now - ts))"; done
          echo "k3s_version=$(k3s --version 2>/dev/null | awk 'NR==1{print $3}')"
          echo "cilium_version=$(kubectl -n kube-system get daemonset cilium -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | sed -E 's/.*:v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "fail2ban=$(systemctl is-active fail2ban 2>/dev/null || true)"
          echo "fail2ban_sshd_jail=$(fail2ban-client status 2>/dev/null | grep -c sshd || true)"
          echo "swap_total_mb=$(awk '/^SwapTotal:/{print int($2/1024)}' /proc/meminfo)"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: machine_state
      changed_when: false

    - name: Compute the gaps of the machine
      ansible.builtin.set_fact:
        machine_gaps: "{{ lookup('ansible.builtin.template', 'machine_gaps.j2') | from_json }}"
      vars:
        state: "{{ machine_state.stdout_lines | map('split', '=', 1) | list }}"
        # 22 stays open to everyone until wireguard_close_public_ssh is set; WireGuard's own port
        # only exists on the Argo CD machine.
        expected_public_ports: >-
          {{ ((node_public_ports | map('regex_replace', '$', '/tcp') | list)
              + ([] if wireguard_close_public_ssh | default(false) | bool else ['22/tcp'])
              + ([wg_port | string ~ '/udp'] if inventory_hostname in groups[org_group ~ '_argocd'] else []))
             | sort }}
        expected_k3s_version: "{{ k3s_version }}"
        expected_cilium_version: "{{ cilium_version }}"
        expected_swap_mb: "{{ node_swap_size_mb | default(2048) }}"
        # The Argo CD machine is the WireGuard server (one peer per other machine of the group),
        # an instance has the Argo CD machine as its only peer.
        expected_wg_peers: >-
          {{ (groups[org_group ~ '_instances'] | default([]) | length)
             if inventory_hostname in groups[org_group ~ '_argocd'] else 1 }}

    - name: Report the gaps of the machine
      ansible.builtin.debug:
        msg: "{{ item.id }}: {{ item.message }}"
      loop: "{{ machine_gaps }}"
      loop_control:
        label: "{{ item.id }}"

    - name: No gap on the machine
      ansible.builtin.assert:
        that: machine_gaps | length == 0
        fail_msg: "{{ inventory_hostname }}: {{ machine_gaps | map(attribute='id') | join(', ') }}, see above."

- name: "Local backup of the sealing keys"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/k8s_instance_secrets/defaults/main.yml
  tasks:
    - name: Stat the sealing key of every instance
      ansible.builtin.stat:
        path: "{{ sealing_keys_dir }}/{{ hostvars[item].org_id }}-{{ hostvars[item].env_name }}.yaml"
      register: sealing_keys
      loop: "{{ groups.keys() | select('match', '.*_instances$') | map('extract', groups) | flatten }}"
      loop_control:
        label: "{{ item }}"

    # A lost sealing key makes the SealedSecrets of the instance unreadable on a rebuilt cluster.
    - name: Every sealing key is backed up here, readable by its owner only
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size | default(0) > 0
          - item.stat.mode | default('0777') is match('^0[0-7]00$')
        fail_msg: >-
          Sealing key of {{ item.item }} missing, empty or readable by others
          ({{ item.invocation.module_args.path }}). Run `playbooks/secrets.yml` again (phase 4), then store it in the team vault.
      loop: "{{ sealing_keys.results }}"
      loop_control:
        label: "{{ item.item }}"

# =============================================================================
# GDPR configuration of the machines (MAIR-293, epic MAIR-284). Read-only.
#
# Every check below that fails is a gap. The play fails on any gap that is not
# listed in `gdpr_allowed_gaps` (group_vars) with its reason: a known gap is
# tracked there, never silently ignored. The decisions come from the Deploiment
# checkout of the group's Argo CD machine (/opt/Deploiment/compliance/<org_id>/,
# MAIR-294).
# =============================================================================

- name: "GDPR configuration of the machines"
  hosts: "*_argocd:*_instances"
  become: true
  gather_facts: false
  vars:
    compliance_dir: "/opt/Deploiment/compliance/{{ org_id }}"
    argocd_host: "{{ groups[org_group ~ '_argocd'][0] }}"
  tasks:
    - name: Read the access decisions of the mairie (Deploiment compliance/)
      ansible.builtin.command: "cat {{ compliance_dir }}/access.yaml"
      delegate_to: "{{ argocd_host }}"
      register: access_file
      changed_when: false
      failed_when: false

    - name: Read the retention decisions of the mairie (Deploiment compliance/)
      ansible.builtin.command: "cat {{ compliance_dir }}/retention.yaml"
      delegate_to: "{{ argocd_host }}"
      register: retention_file
      changed_when: false
      failed_when: false

    - name: Read this machine's WireGuard public key
      ansible.builtin.command: cat /etc/wireguard/public.key
      register: wg_self_key
      changed_when: false
      failed_when: false

    - name: Collect the GDPR-relevant state of the machine
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "auditd=$(systemctl is-active auditd 2>/dev/null || true)"
          sshd -T 2>/dev/null | awk '$1=="passwordauthentication"||$1=="permitrootlogin"{print $1"="$2}'
          # A public rule for 22 is one without "on wg0".
          ufw status 2>/dev/null | grep -E '^22(/tcp)? ' | grep -vq ' on wg0' && echo "public_ssh=open" || echo "public_ssh=closed"
          echo "secrets_encryption=$(k3s secrets-encrypt status 2>/dev/null | awk -F': *' '/Encryption Status/{print $2}')"
          echo "unattended_upgrades=$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Periodic::Unattended-Upgrade /{print $2}')"
          echo "disk_encrypted=$(lsblk -no TYPE 2>/dev/null | grep -qx crypt && echo yes || echo no)"
          echo "journald_retention=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -F= '/^MaxRetentionSec=/{v=$2} END{print v}')"
          for f in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
            [ -f "$f" ] && ssh-keygen -lf "$f" 2>/dev/null | awk '{print "ssh_key="$2}'
          done
          wg show wg0 peers 2>/dev/null | sed 's/^/wg_peer=/'
      args:
        executable: /bin/bash
      register: gdpr_state
      changed_when: false

    - name: Collect the Argo CD accounts
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get configmap argocd-cm -o json \
          | jq -r '.data // {} | keys[] | select(startswith("accounts.")) | select(endswith(".enabled") | not) | ltrimstr("accounts.")'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_accounts
      changed_when: false
      when: inventory_hostname in groups[org_group ~ '_argocd']

    - name: Compute the GDPR gaps of the machine
      ansible.builtin.set_fact:
        gdpr_gaps: "{{ lookup('ansible.builtin.template', 'gdpr_gaps.j2') | from_yaml }}"
      vars:
        state: "{{ gdpr_state.stdout_lines | map('split', '=', 1) | list }}"
        access: "{{ (access_file.stdout | default('') | from_yaml) if access_file.rc == 0 else None }}"
        retention: "{{ (retention_file.stdout | default('') | from_yaml) if retention_file.rc == 0 else None }}"
        group_wg_keys: "{{ groups[org_group ~ '_argocd'] + groups[org_group ~ '_instances'] | default([]) }}"

    - name: Report the GDPR gaps
      ansible.builtin.debug:
        msg: "{{ item.id }}: {{ item.message }}{{ ' (allowed: ' ~ gdpr_allowed_gaps[item.id] ~ ')' if item.id in gdpr_allowed_gaps else '' }}"
      loop: "{{ gdpr_gaps }}"
      loop_control:
        label: "{{ item.id }}"

    - name: No GDPR gap outside the allowed ones
      ansible.builtin.assert:
        that: gdpr_gaps | rejectattr('id', 'in', gdpr_allowed_gaps | list) | list | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: {{ gdpr_gaps | rejectattr('id', 'in', gdpr_allowed_gaps | list) | map(attribute='id') | join(', ') }}.
          Fix them, or list each in gdpr_allowed_gaps (group_vars) with its reason.
