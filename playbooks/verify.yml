---
# =============================================================================
# Acceptance test of a deployment. Run it after site.yml.
#
#   ansible-playbook playbooks/verify.yml
#
# Fails when any check fails: usable as a CI step.
# =============================================================================

- name: "Preflight"
  ansible.builtin.import_playbook: preflight.yml

- name: "Every machine — SSH exposure and secrets encryption (MAIR-415)"
  hosts: "*_argocd:*_instances"
  become: true
  gather_facts: false
  tasks:
    - name: Read the firewall rules
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false

    # Any 22/tcp ALLOW rule not bound to wg0 is reachable from the Internet.
    - name: Public SSH is closed (expected outside a bootstrap run)
      ansible.builtin.assert:
        that: >-
          ssh_via_public_ip | bool or
          ufw_status.stdout_lines | select('match', '^22/tcp( [(]v6[)])?\\s+ALLOW') | list | length == 0
        fail_msg: >-
          Port 22 is open publicly on {{ inventory_hostname }}:
          {{ ufw_status.stdout_lines | select('match', '^22/tcp') | join(' | ') }}.
          Re-run site.yml without -e ssh_via_public_ip=true.

    - name: Read the sshd effective configuration
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    - name: sshd accepts public keys only, no root login
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
        fail_msg: "sshd on {{ inventory_hostname }} is not hardened: re-run site.yml (role k8s_node)."

    - name: Read the secrets encryption status
      ansible.builtin.command: k3s secrets-encrypt status
      register: encryption_status
      changed_when: false

    - name: Secrets are encrypted at rest
      ansible.builtin.assert:
        that: "'Encryption Status: Enabled' in encryption_status.stdout"
        fail_msg: "{{ encryption_status.stdout_lines | join(' | ') }}"

- name: "Argo CD machines"
  hosts: "*_argocd"
  become: true
  gather_facts: false
  tasks:
    - name: Les Applications Argo CD sont Synced et Healthy
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps
      changed_when: false

    - name: Afficher l'état des Applications
      ansible.builtin.debug:
        var: apps.stdout_lines

    - name: Aucune Application en échec
      ansible.builtin.assert:
        that:
          - "'Degraded' not in apps.stdout"
          - "'Unknown' not in apps.stdout"
        fail_msg: "Applications en erreur — voir la sortie ci-dessus."

    # A sync operation that fails to generate its manifests does not end on
    # its own: Argo CD retries it on the revision it pinned when it started
    # (MAIR-173). Such an operation still reads "Running", so the status
    # check above can miss it. Flag any operation stuck on a ComparisonError
    # or running for longer than verify_stuck_sync_minutes.
    - name: No Application stuck in a sync operation
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get applications.argoproj.io -o json | jq -r --argjson max "$MAX_SECONDS" '
          .items[]
          | select(.status.operationState.phase == "Running")
          | select(
              any(.status.conditions[]?; .type == "ComparisonError")
              or (now - (.status.operationState.startedAt | fromdateiso8601) > $max))
          | "\(.metadata.name): \(.status.operationState.message // "")"'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        MAX_SECONDS: "{{ (verify_stuck_sync_minutes | default(15) | int) * 60 }}"
      register: stuck_syncs
      changed_when: false

    - name: Report stuck sync operations
      ansible.builtin.assert:
        that: stuck_syncs.stdout | length == 0
        fail_msg: >-
          Stuck sync operation(s): {{ stuck_syncs.stdout_lines | join(' | ') }}.
          On this machine, run
          `sudo KUBECONFIG=/root/.kube/argocd-cli.yaml argocd app terminate-op <app> --core`,
          then let auto-sync pick up the latest commit.

    - name: Les instances du groupe sont bien enregistrées et étiquetées
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster,mairie360.fr/role=instance \
          -o jsonpath='{range .items[*]}{.metadata.labels.mairie360\.fr/env}{"\n"}{end}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: registered
      changed_when: false

    - name: Toutes les instances déclarées sont enregistrées
      ansible.builtin.assert:
        that:
          - hostvars[item].env_name in registered.stdout_lines
        fail_msg: >-
          L'instance {{ item }} (env {{ hostvars[item].env_name }}) n'est pas
          enregistrée dans cet Argo CD. Relancer la phase 3.
      loop: "{{ groups[org_group ~ '_instances'] | default([]) }}"

- name: "Instances"
  hosts: "*_instances"
  become: true
  gather_facts: false
  tasks:
    # The Deploiment checkout only lives on the Argo CD machine, which also
    # holds a kubeconfig for each instance (phase 3), with a context named
    # after the environment: run verify.sh from there.
    - name: Refresh the instance kubeconfig on the Argo CD machine
      ansible.builtin.include_role:
        name: k8s_instance_link
        tasks_from: kubeconfig

    - name: Full acceptance test of the instance (Deploiment/scripts/verify.sh)
      ansible.builtin.command:
        cmd: "./scripts/verify.sh {{ env_name }} {{ env_name }} {{ instance_domain }}"
        chdir: /opt/Deploiment
      environment:
        KUBECONFIG: "/root/.kube/instance-{{ env_name }}.yaml"
      delegate_to: "{{ groups[org_group ~ '_argocd'][0] }}"
      register: verify
      changed_when: false
      failed_when: false

    - name: Acceptance test output
      ansible.builtin.debug:
        var: verify.stdout_lines

    - name: Every check passed
      ansible.builtin.assert:
        that: verify.rc == 0
        fail_msg: "scripts/verify.sh failed for {{ inventory_hostname }}, see its output above."
