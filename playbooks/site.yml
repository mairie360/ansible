---
# =============================================================================
# Full deployment — every machine, every group.
#
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit mairie360_argocd:mairie360_instances
#   ansible-playbook playbooks/site.yml --limit client_example_argocd:client_example_instances
#
# The four phases: prepare the k8s base, start the group's Argo CD, link the
# instances to it once both sides are ready, then seal each instance's
# secrets (prompting for the external ones that are missing).
#
# The `*_argocd` / `*_instances` patterns are resolved by Ansible itself:
# adding a client needs NO change here. Always --limit whole groups
# (<org>_argocd:<org>_instances): the WireGuard phase needs every machine of
# the group.
#
# Ansible connects through the WireGuard tunnel (MAIR-415). A new machine, or
# a group without an admin peer yet, needs one bootstrap run through the
# public IPs: add -e ssh_via_public_ip=true (README, "SSH access"). The vault
# holding the public IPs is always needed: --ask-vault-pass.
# =============================================================================

- name: "Preflight"
  ansible.builtin.import_playbook: preflight.yml

- name: "Phase 1 — system base and k3s (every machine)"
  hosts: "*_argocd:*_instances"
  become: true
  roles:
    - role: k8s_node
      # Only the instances expose HTTP(S): they run the fronts. The Argo CD
      # machine exposes nothing publicly.
      node_public_ports: "{{ ['80', '443'] if inventory_hostname in groups[org_group ~ '_instances'] | default([]) else [] }}"

- name: "Phase 1b — WireGuard tunnel of the group"
  hosts: "*_argocd:*_instances"
  become: true
  roles:
    - wireguard

- name: "Phase 2 — Argo CD of the group"
  hosts: "*_argocd"
  become: true
  # One group at a time: the GHCR credentials prompt is asked per group.
  serial: 1
  roles:
    - k8s_argocd

- name: "Phase 3 — link the instances to their Argo CD"
  hosts: "*_instances"
  become: true
  roles:
    - k8s_instance_link

- name: "Phase 4 — instance secrets"
  ansible.builtin.import_playbook: secrets.yml
