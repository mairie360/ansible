---
# =============================================================================
# Phase 4 — seal the secrets of the instances (role k8s_instance_secrets).
# Imported by site.yml; also runnable alone, e.g. to change a Resend key:
#
#   ansible-playbook playbooks/secrets.yml --limit mairie360-dev
#   RESEND_API_KEY=re_xxx ansible-playbook playbooks/secrets.yml --limit mairie360-dev
#   ansible-playbook playbooks/secrets.yml -e @secrets.yml --ask-vault-pass
#   ansible-playbook playbooks/secrets.yml -e secrets_open_pr=true   # + Deploiment PR
#
# Needs phase 3 done on the instance (kubeconfig on the Argo CD machine,
# cluster labelled so that Argo CD deploys the sealed-secrets controller).
# =============================================================================

- name: "Phase 4 — instance secrets"
  hosts: "*_instances"
  become: true
  gather_facts: false
  # One instance at a time: prompts are asked per instance.
  serial: 1
  roles:
    - k8s_instance_secrets
  # After the last instance only: one Deploiment PR for the whole run
  # (secrets_open_pr). A task of this play, not a play on localhost: --limit
  # would leave such a play without hosts.
  post_tasks:
    - name: Open the Deploiment PR
      ansible.builtin.include_role:
        name: k8s_instance_secrets
        tasks_from: open_pr
      when: inventory_hostname == ansible_play_hosts_all[-1]
