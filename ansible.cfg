[defaults]
inventory            = inventory/hosts.yml
host_key_checking    = False
timeout              = 60
roles_path           = roles
# community.general's `yaml` callback was removed in 12.0.0: same output with
# the built-in callback.
stdout_callback      = default
callback_result_format = yaml
# Affiche un récapitulatif des tâches lentes : utile pour repérer un k3s qui rame.
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent
# Le mode --check doit dire quelque chose d'utile : on évite les
# `changed_when: true` systématiques dans les rôles.
retry_files_enabled  = False

[ssh_connection]
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=60 -o ConnectionAttempts=5
pipelining   = True
