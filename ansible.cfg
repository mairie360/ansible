[defaults]
inventory            = inventory/hosts.yml
# Host keys are checked (MAIR-415): these connections carry admin kubeconfigs
# and secrets. A new host is accepted on first contact (accept-new, below),
# a changed key fails the run. Normal runs go through the WireGuard tunnel,
# which already authenticates the machine.
host_key_checking    = True
timeout              = 60
roles_path           = roles
# community.general's `yaml` callback was removed in 12.0.0: same output with
# the built-in callback.
stdout_callback      = default
callback_result_format = yaml
# Summary of the slow tasks: handy to spot a struggling k3s.
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent
# --check mode must say something useful: roles avoid unconditional
# `changed_when: true`.
retry_files_enabled  = False

[ssh_connection]
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=60 -o ConnectionAttempts=5 -o StrictHostKeyChecking=accept-new
pipelining   = True
