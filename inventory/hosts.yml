# =============================================================================
# Inventaire Mairie360
#
# MODÈLE : un groupe = un Argo CD + ses instances. Chaque machine est un
# cluster k3s mono-nœud.
#
#   <org>_argocd     : LA machine qui porte l'Argo CD du groupe
#   <org>_instances  : les machines qui portent une instance Mairie360
#
# Les playbooks ciblent les motifs `*_argocd` et `*_instances` : ajouter un
# client se fait ICI uniquement, aucun playbook ni rôle à modifier.
#
# ansible_host = IP par laquelle le CONTRÔLEUR Ansible joint la machine (SSH).
# La liaison Argo CD -> instance passe par l'IP WireGuard (`wg_ip`), jamais
# par l'IP publique : le port 6443 ne doit jamais être exposé sur Internet.
# =============================================================================
all:
  children:

    # ---------------------------------------------------------------- mairie360
    mairie360_argocd:
      hosts:
        mairie360-argocd:
          ansible_host: "212.47.242.79"
          wg_ip: "10.10.0.1"

    mairie360_instances:
      hosts:
        mairie360-dev:
          ansible_host: "163.172.7.159"
          wg_ip: "10.10.0.11"
          env_name: dev
          instance_domain: "dev.mairie360-eip.fr"
        mairie360-staging:
          ansible_host: "195.154.157.114"
          wg_ip: "10.10.0.12"
          env_name: staging
          instance_domain: "staging.mairie360-eip.fr"
        mairie360-prod:
          ansible_host: "51.15.251.220"
          wg_ip: "10.10.0.13"
          env_name: prod
          instance_domain: "prod.mairie360-eip.fr"

    # ------------------------------------------------------------ client-example
    # Modèle pour un vrai client : deux machines suffisent. Utiliser un
    # sous-réseau WireGuard distinct par groupe (10.10.1.0/24, 10.10.2.0/24…) :
    # l'Argo CD d'un client n'a ainsi aucune route vers les instances d'un autre.
    #
    # client_example_argocd:
    #   hosts:
    #     client-example-argocd:
    #       ansible_host: "<ip-ssh>"
    #       wg_ip: "10.10.1.1"
    #
    # client_example_instances:
    #   hosts:
    #     client-example-prod:
    #       ansible_host: "<ip-ssh>"
    #       wg_ip: "10.10.1.11"
    #       env_name: prod
    #       instance_domain: "mairie360.ville-exemple.fr"

  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/login_scaleway_mairie360"
