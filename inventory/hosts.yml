# =============================================================================
# Mairie360 inventory
#
# MODEL: one group = one Argo CD + its instances. Every machine is a
# single-node k3s cluster.
#
#   <org>            : parent group, its variables live in group_vars/<org>.yml
#                      (org_id, admin WireGuard peers)
#   <org>_argocd     : THE machine that runs the group's Argo CD
#   <org>_instances  : the machines that run a Mairie360 instance
#
# The playbooks target the `*_argocd` and `*_instances` patterns: adding a
# client only happens HERE (plus its group_vars file and its public IPs in the
# vault), no playbook or role changes.
#
# No public IP in this file (MAIR-415): they live in the ansible-vault file
# group_vars/all/vault.yml (`vault_public_ips`). Ansible reaches every machine
# through its WireGuard IP (`wg_ip`), from an admin workstation that is a peer
# of the group's tunnel (`wireguard_admin_peers`). Only a bootstrap run uses
# the public IPs: -e ssh_via_public_ip=true (README, "SSH access").
# =============================================================================
all:
  children:

    # ---------------------------------------------------------------- mairie360
    mairie360:
      children:
        mairie360_argocd:
          hosts:
            mairie360-argocd:
              wg_ip: "10.10.0.1"

        mairie360_instances:
          hosts:
            mairie360-dev:
              wg_ip: "10.10.0.11"
              env_name: dev
              instance_domain: "dev.mairie360-eip.fr"
              ingress_controller: traefik
            mairie360-staging:
              wg_ip: "10.10.0.12"
              env_name: staging
              instance_domain: "staging.mairie360-eip.fr"
            mairie360-prod:
              wg_ip: "10.10.0.13"
              env_name: prod
              instance_domain: "prod.mairie360-eip.fr"

    # ------------------------------------------------------------ client-example
    # Template for a real client: two machines are enough. Use a distinct
    # WireGuard subnet per group (10.10.1.0/24, 10.10.2.0/24...): a client's
    # Argo CD then has no route to another group's instances. Copy
    # group_vars/client-example.yml.example to group_vars/client_example.yml
    # and add the public IPs to group_vars/all/vault.yml.
    #
    # client_example:
    #   children:
    #     client_example_argocd:
    #       hosts:
    #         client-example-argocd:
    #           wg_ip: "10.10.1.1"
    #
    #     client_example_instances:
    #       hosts:
    #         client-example-prod:
    #           wg_ip: "10.10.1.11"
    #           env_name: prod
    #           instance_domain: "mairie360.ville-exemple.fr"

  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/login_scaleway_mairie360"
