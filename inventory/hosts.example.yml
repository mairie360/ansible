# =============================================================================
# Mairie360 inventory: EXAMPLE (MAIR-708)
#
# The real inventory, inventory/hosts.yml, is gitignored: this repository is
# public and must not publish the addresses of the machines. Copy this file to
# inventory/hosts.yml and put the real addresses there (ask the team for the
# current one); ansible.cfg reads inventory/hosts.yml. The addresses below are
# documentation ones (RFC 5737), `wg_ip` are private WireGuard addresses.
# tests/check_no_public_ip.py fails when a tracked file holds a public IP.
#
# MODEL: one group = one Argo CD + its instances. Each machine is a
# single-node k3s cluster.
#
#   <org>_argocd     : THE machine holding the group's Argo CD
#   <org>_instances  : the machines holding a Mairie360 instance
#
# The playbooks target the `*_argocd` and `*_instances` patterns: adding a
# client is done HERE only, no playbook or role to change.
#
# ansible_host = address the Ansible CONTROLLER reaches the machine on (SSH).
# Argo CD -> instance traffic goes through the WireGuard address (`wg_ip`),
# never the public one: port 6443 must never be exposed on the Internet.
# =============================================================================
all:
  children:

    # ---------------------------------------------------------------- mairie360
    mairie360_argocd:
      hosts:
        mairie360-argocd:
          ansible_host: "203.0.113.10"
          wg_ip: "10.10.0.1"

    mairie360_instances:
      hosts:
        mairie360-dev:
          ansible_host: "203.0.113.11"
          wg_ip: "10.10.0.11"
          env_name: dev
          instance_domain: "dev.mairie360-eip.fr"
          ingress_controller: traefik
        mairie360-staging:
          ansible_host: "203.0.113.12"
          wg_ip: "10.10.0.12"
          env_name: staging
          instance_domain: "staging.mairie360-eip.fr"
          ingress_controller: traefik
        mairie360-prod:
          ansible_host: "203.0.113.13"
          wg_ip: "10.10.0.13"
          env_name: prod
          instance_domain: "prod.mairie360-eip.fr"
          ingress_controller: traefik

    # ------------------------------------------------------------ client-example
    # Modèle pour un vrai client : deux machines suffisent. Utiliser un
    # sous-réseau WireGuard distinct par groupe (10.10.1.0/24, 10.10.2.0/24…) :
    # l'Argo CD d'un client n'a ainsi aucune route vers les instances d'un autre.
    #
    # client_example_argocd:
    #   hosts:
    #     client-example-argocd:
    #       ansible_host: "<ip-ssh>"
    #       wg_ip: "10.10.1.1"
    #
    # client_example_instances:
    #   hosts:
    #     client-example-prod:
    #       ansible_host: "<ip-ssh>"
    #       wg_ip: "10.10.1.11"
    #       env_name: prod
    #       instance_domain: "mairie360.ville-exemple.fr"

  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/login_scaleway_mairie360"
