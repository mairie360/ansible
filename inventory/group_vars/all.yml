# Variables communes à toutes les machines, tous groupes confondus.

deploiment_repo_url: "https://github.com/mairie360/Deploiment.git"
# Branche suivie. Reprise à la fois par platform-app.yaml et par
# l'ApplicationSet des instances : les deux ne peuvent pas diverger, ce qui
# évite le « je pousse mais rien ne change ».
deploiment_repo_branch: "main"

# Pinned versions. Bumps go through a PR, never through a playbook run that
# would pick "the latest".
#
# k3s: exact release (INSTALL_K3S_VERSION), installed with the install.sh of
# that same tag. Re-running site.yml after a bump upgrades the machines, one
# at a time (role k8s_node). Kubernetes minors cannot be skipped: go through
# every minor in between (README, "Upgrading k3s").
# v1.35: supported upstream until 2027-02-28, in the tested matrix of Cilium
# 1.20 and Argo CD 3.4.
k3s_version: "v1.35.8+k3s1"
# Argo CD 3.4 (supported line, tested on Kubernetes 1.32-1.35). 3.5 is left
# for a later bump: it moves to Helm 4.
argocd_version: "v3.4.9"

# Réseau interne k3s : sans ces autorisations UFW, le pare-feu casse le trafic
# entre pods (CoreDNS en CrashLoop, services injoignables).
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

wg_subnet: "10.10.0.0/16"
wg_port: 51820

# org_id garde les tirets : il doit correspondre au dossier
# clusters/<org_id>/ du dépôt Deploiment (ex. "client-example").
# Les noms de GROUPES Ansible, eux, n'acceptent que des underscores.
# org_group fait le pont — c'est lui qu'il faut utiliser dans groups[...].
org_group: "{{ org_id | replace('-', '_') }}"

# CNI. Cilium replaces flannel on every machine (role k8s_node,
# tasks/cilium.yml); Hubble is its observability layer. Both CLIs are
# installed on the machine. Same rule as above: bumps go through a PR.
cilium_version: "1.20.2"
cilium_cli_version: "v0.20.0"
hubble_cli_version: "v1.19.4"

# kubeseal client, installed on each Argo CD machine (role
# k8s_instance_secrets). Matches the appVersion of the sealed-secrets chart
# pinned in Deploiment/bootstrap/appsets/sealed-secrets-appset.yaml (2.17.3).
kubeseal_version: "0.30.0"

# GHCR pull credentials: argocd/ghcr-secret (read by argocd-image-updater,
# role k8s_argocd) and the ghcr-secret sealed into every instance (role
# k8s_instance_secrets). Taken from GHCR_USER / GHCR_TOKEN, else kept from the
# argocd/ghcr-secret already on the Argo CD machine, else prompted.
ghcr_user: "{{ lookup('ansible.builtin.env', 'GHCR_USER') }}"
ghcr_token: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') }}"

# Ask interactively for every secret that is neither provided nor already on
# the cluster. Set to false in CI (-e secrets_prompt=false): missing secrets
# are then only reported.
secrets_prompt: true
