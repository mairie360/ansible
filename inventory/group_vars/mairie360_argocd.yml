org_id: mairie360
# MAIR-346: the Deploiment "Promote" workflow runs scripts/verify.sh on
# staging from a runner on this machine (role github_runner).
github_runner_enabled: true
# MAIR-803: the Operations workflow of this repository runs secrets.yml and
# verify.yml on this group's instances from this machine (role ops_runner).
ops_runner_enabled: true
# MAIR-621: the external probe of the group's instances (role hub_probe) pushes
# to Cockpit source mairie360-probes (OTLP push URL, same form as the
# instances' collectors in Deploiment). Empty = no probe. Not secret: the token
# is read from the vault (/mairie360/hub/cockpit-token).
hub_probe_metrics_endpoint: "https://60ca2d6c-4321-4ea9-8ff5-cd43a48253bf.metrics.cockpit.fr-par.scw.cloud/otlp/v1/metrics"
