---
# =============================================================================
# WireGuard — one tunnel PER GROUP.
#
# The group's Argo CD is the server (it listens); every instance of the group
# opens an outbound connection to it. No global mesh: a client's Argo CD has
# no network route to another group's instances.
#
# The admin workstations (wireguard_admin_peers) are peers of the server too,
# which routes them to the instances, SSH only (MAIR-415). Instances cannot
# reach each other through it: the server forwards nothing else.
#
# This tunnel is what keeps ports 6443 and 22 closed publicly.
# =============================================================================

# The server's wg0.conf lists one peer per instance of the group, built from
# the public key each host reads during this play. A --limit that leaves out
# part of a group would render that file without the missing peers (or fail on
# their undefined keys): always run this role on whole groups.
- name: Check that the whole group is in the play
  ansible.builtin.assert:
    that:
      - (groups[org_group ~ '_argocd'] + groups[org_group ~ '_instances'] | default([]))
        | difference(ansible_play_hosts_all) | length == 0
    fail_msg: >-
      The WireGuard tunnel of group '{{ org_id }}' needs every machine of the
      group in the same run. Missing:
      {{ (groups[org_group ~ '_argocd'] + groups[org_group ~ '_instances'] | default([]))
         | difference(ansible_play_hosts_all) | join(', ') }}.
      Use --limit '{{ org_group }}_argocd:{{ org_group }}_instances'.

# An admin IP outside the group's /24 would get no route (wg-quick only adds
# the route of `Address`), and one taken by a machine would steal its traffic.
- name: Check the admin peers
  ansible.builtin.assert:
    that:
      - item.name is defined and item.public_key is defined and item.wg_ip is defined
      - item.wg_ip is match((wg_ip.split('.')[:3] | join('[.]')) ~ '[.][0-9]+$')
      - item.wg_ip not in (groups[org_group ~ '_argocd'] + groups[org_group ~ '_instances'] | default([])) | map('extract', hostvars, 'wg_ip') | list
    fail_msg: >-
      wireguard_admin_peers of group '{{ org_id }}': each entry needs name,
      public_key and a wg_ip inside {{ wg_ip.split('.')[:3] | join('.') }}.0/24
      that no machine uses. Got {{ item }}.
  loop: "{{ wireguard_admin_peers }}"
  loop_control:
    label: "{{ item.name | default(item) }}"

- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate the private key when missing
  ansible.builtin.shell: |
    set -o pipefail
    umask 077 && wg genkey > /etc/wireguard/private.key
  args:
    executable: /bin/bash
    creates: /etc/wireguard/private.key

- name: Derive the public key
  ansible.builtin.shell: |
    set -o pipefail
    wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key
  args:
    executable: /bin/bash
    creates: /etc/wireguard/public.key

- name: Read the private key
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_private
  no_log: true

- name: Read the public key
  ansible.builtin.slurp:
    src: /etc/wireguard/public.key
  register: wg_public

- name: Keep the keys for the other machines of the group
  ansible.builtin.set_fact:
    wg_private_key: "{{ wg_private.content | b64decode | trim }}"
    wg_public_key: "{{ wg_public.content | b64decode | trim }}"
  no_log: true

# Both facts above are readable through hostvars by the other hosts of the
# play: that is how the server learns its peers' public keys without storing
# them on the controller.

- name: Write the WireGuard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  # wg0.conf embeds the private key: no diff, no logged arguments.
  diff: false
  no_log: true
  notify: Reload WireGuard

- name: Open the WireGuard port (group server only)
  community.general.ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp
    comment: "WireGuard"
  when: inventory_hostname in groups[org_group ~ '_argocd']

- name: Enable WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@wg0"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply a configuration change right away
  ansible.builtin.meta: flush_handlers

# --- Admin peers: routed to the instances, SSH only ---------------------------
# The server forwards wg0 -> wg0 for the admin peers' SSH only. UFW's routed
# policy stays deny, so instance-to-instance traffic is still dropped.
# A peer removed from wireguard_admin_peers loses its key in wg0.conf, which
# is enough to cut it; its stale UFW rules are harmless (`ufw status
# numbered` + `ufw delete` to tidy them).

- name: Enable IPv4 forwarding on the server
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
    reload: true
  when: inventory_hostname in groups[org_group ~ '_argocd']

- name: Route the admin peers to the instances' SSH
  community.general.ufw:
    rule: allow
    route: true
    interface_in: wg0
    interface_out: wg0
    from_ip: "{{ item.0.wg_ip }}"
    to_ip: "{{ hostvars[item.1].wg_ip }}"
    port: "22"
    proto: tcp
    comment: "admin {{ item.0.name }} -> {{ item.1 }} SSH"
  loop: "{{ wireguard_admin_peers | product(groups[org_group ~ '_instances'] | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  when: inventory_hostname in groups[org_group ~ '_argocd']

- name: Show the peer block of an admin workstation's configuration
  ansible.builtin.debug:
    msg:
      - "[Peer] for the admin workstations of group {{ org_id }} (README, \"SSH access\"):"
      - "PublicKey = {{ wg_public_key }}"
      - "Endpoint = <public IP of {{ inventory_hostname }}, vault_public_ips>:{{ wg_port }}"
      - "AllowedIPs = {{ wg_ip.split('.')[:3] | join('.') }}.0/24"
      - "PersistentKeepalive = 25"
  when: inventory_hostname in groups[org_group ~ '_argocd']
