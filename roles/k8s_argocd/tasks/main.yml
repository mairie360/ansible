---
# =============================================================================
# PHASE 2 — Infra Kubernetes : Argo CD du groupe
#
# S'applique à UNE machine par groupe (`<org>_argocd`).
#
# Ce rôle installe Argo CD et l'amorce. Il n'installe NI cert-manager, NI
# ingress-nginx, NI de ClusterIssuer : tout cela est déployé par Argo CD sur
# les instances, depuis le dépôt Deploiment. Installer ces composants ici
# créerait un doublon en conflit avec les AppSets (versions différentes,
# CRD concurrentes) — c'est exactement ce qui posait problème avant.
# =============================================================================

- name: Installer les dépendances du rôle
  ansible.builtin.apt:
    name: [git, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Argo CD ------------------------------------------------------------------

- name: Créer le namespace argocd
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ns_argocd
  changed_when: "'created' in ns_argocd.stdout"

- name: Installer Argo CD (version épinglée)
  ansible.builtin.command: >
    kubectl apply -n argocd --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

- name: Attendre la disponibilité d'Argo CD
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment --all
    -n argocd --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Installer la CLI argocd (utilisée par le rôle de liaison)
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    mode: "0755"

# --- Amorçage GitOps ----------------------------------------------------------

- name: Récupérer le dépôt Deploiment (pour platform-app.yaml)
  ansible.builtin.git:
    repo: "{{ deploiment_repo_url }}"
    dest: /opt/Deploiment
    version: "{{ deploiment_repo_branch }}"
    force: true

- name: Adapter platform-app.yaml au dépôt et à la branche déployés
  ansible.builtin.replace:
    path: /opt/Deploiment/bootstrap/platform-app.yaml
    regexp: "{{ item.re }}"
    replace: "{{ item.rep }}"
  loop:
    - { re: "repoURL: https://github.com/mairie360/Deploiment.git", rep: "repoURL: {{ deploiment_repo_url }}" }
    - { re: "targetRevision: main", rep: "targetRevision: {{ deploiment_repo_branch }}" }
  loop_control:
    label: "{{ item.re }}"

- name: Appliquer l'Application racine (socle du groupe)
  ansible.builtin.command: kubectl apply -n argocd -f /opt/Deploiment/bootstrap/platform-app.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: platform_apply
  changed_when: "'created' in platform_apply.stdout or 'configured' in platform_apply.stdout"

- name: Rendre l'ApplicationSet des instances du groupe
  ansible.builtin.template:
    src: instances-appset.yaml.j2
    dest: /opt/Deploiment/instances-appset.yaml
    mode: "0644"

# Migration from the multi-source layout (MAIR-173). Instance Applications
# used to be multi-source, so argocd-image-updater stored its tags under
# spec.sources[0].helm.parameters. The single-source AppSet only preserves
# spec.source.helm.parameters: without this carry-over, every instance would
# fall back to the tags of its values.yaml until the image updater's next
# pass. No-op once every Application is single-source.
- name: Save the image tags of multi-source instance Applications
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get applications.argoproj.io -o json | jq -c '
      [.items[]
       | select(any(.metadata.ownerReferences[]?; .kind == "ApplicationSet" and .name == "instances"))
       | select(.spec.sources != null)
       | {name: .metadata.name, parameters: (.spec.sources[0].helm.parameters // [])}
       | select(.parameters | length > 0)]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: multisource_apps
  changed_when: false

# This file scopes the Argo CD to `clusters/{{ org_id }}/instances/*`. It is
# not versioned in Deploiment because it depends on org_id: each group has its
# own, and no Argo CD sees another group's instances.
- name: Appliquer l'ApplicationSet des instances
  ansible.builtin.command: kubectl apply -n argocd -f /opt/Deploiment/instances-appset.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: appset_apply
  changed_when: "'created' in appset_apply.stdout or 'configured' in appset_apply.stdout"

- name: Wait for the ApplicationSet to convert the instance Applications
  ansible.builtin.command: >
    kubectl -n argocd get applications.argoproj.io {{ item.name }}
    -o jsonpath={.spec.source.repoURL}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: converted
  changed_when: false
  retries: 30
  delay: 2
  until: converted.stdout | length > 0
  loop: "{{ multisource_apps.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"

- name: Restore the image tags on the converted Applications
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - patch
      - applications.argoproj.io
      - "{{ item.name }}"
      - --type=merge
      - -p
      - "{{ {'spec': {'source': {'helm': {'parameters': item.parameters}}}} | to_json }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop: "{{ multisource_apps.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"

# --- GHCR credentials (argocd/ghcr-secret) ------------------------------------
# argocd-image-updater reads the GHCR tags with pullsecret:argocd/ghcr-secret
# (Deploiment/bootstrap/appsets/image-updater-app.yaml). Nothing in Deploiment
# creates it: the token is not committable, even sealed (this machine has no
# sealed-secrets controller).

- name: Read the GHCR credentials already stored on this machine
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret ghcr-secret -o json 2>/dev/null \
      | jq -c '.data[".dockerconfigjson"] | @base64d | fromjson | .auths["ghcr.io"] | {username, password}' \
      || echo '{}'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ghcr_existing
  changed_when: false
  no_log: true

- name: Resolve the GHCR credentials (variables, else this machine)
  ansible.builtin.set_fact:
    ghcr_resolved_user: "{{ ghcr_user if ghcr_token | length > 0 else (ghcr_existing.stdout | from_json).username | default('', true) }}"
    ghcr_resolved_token: "{{ ghcr_token if ghcr_token | length > 0 else (ghcr_existing.stdout | from_json).password | default('', true) }}"
  no_log: true

- name: Ask for the GHCR user
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] GHCR user for ghcr-secret (read:packages token owner, empty to skip)"
  register: ghcr_user_prompt
  when:
    - secrets_prompt | bool
    - ghcr_resolved_token | length == 0

- name: Ask for the GHCR token
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] GHCR token (read:packages, hidden, empty to skip)"
    echo: false
  register: ghcr_token_prompt
  when:
    - secrets_prompt | bool
    - ghcr_resolved_token | length == 0
    - ghcr_user_prompt.user_input | default('') | length > 0

- name: Keep the prompted GHCR credentials
  ansible.builtin.set_fact:
    ghcr_resolved_user: "{{ ghcr_user_prompt.user_input }}"
    ghcr_resolved_token: "{{ ghcr_token_prompt.user_input }}"
  when: ghcr_token_prompt.user_input | default('') | length > 0
  no_log: true

- name: Write argocd/ghcr-secret
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd create secret docker-registry ghcr-secret \
      --docker-server=ghcr.io \
      --docker-username="$GHCR_USER" --docker-password="$GHCR_TOKEN" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    GHCR_USER: "{{ ghcr_resolved_user }}"
    GHCR_TOKEN: "{{ ghcr_resolved_token }}"
  register: ghcr_apply
  changed_when: "'unchanged' not in ghcr_apply.stdout"
  when: ghcr_resolved_token | length > 0
  no_log: true

- name: Warn when no GHCR credentials are available
  ansible.builtin.debug:
    msg: >-
      No GHCR credentials (GHCR_USER / GHCR_TOKEN): argocd-image-updater cannot
      list tags, image tags will not be updated automatically.
  when: ghcr_resolved_token | length == 0

# --- argocd-image-updater: one ImageUpdater per instance ----------------------
# The CRD is installed by the argocd-image-updater Application that
# platform-app has just started syncing: wait for it before applying.

- name: Wait for the ImageUpdater CRD
  ansible.builtin.command: >
    kubectl wait --for condition=established --timeout=30s
    crd/imageupdaters.argocd-image-updater.argoproj.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: imageupdater_crd
  changed_when: false
  retries: 30
  delay: 10
  until: imageupdater_crd.rc == 0

- name: Render the ImageUpdaters of the group
  ansible.builtin.template:
    src: image-updaters.yaml.j2
    dest: /opt/Deploiment/image-updaters.yaml
    mode: "0644"
  when: groups[org_group ~ '_instances'] | default([]) | length > 0

- name: Apply the ImageUpdaters of the group
  ansible.builtin.command: kubectl apply -f /opt/Deploiment/image-updaters.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: imageupdaters_apply
  changed_when: "'created' in imageupdaters_apply.stdout or 'configured' in imageupdaters_apply.stdout"
  when: groups[org_group ~ '_instances'] | default([]) | length > 0

# --- Sortie -------------------------------------------------------------------

- name: Récupérer le mot de passe admin initial
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret argocd-initial-admin-secret \
      -o jsonpath='{.data.password}' | base64 -d
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_password
  changed_when: false
  failed_when: false

- name: Afficher les accès
  ansible.builtin.debug:
    msg:
      - "Argo CD du groupe {{ org_id }} installé sur {{ inventory_hostname }}."
      - "Mot de passe admin : {{ argocd_password.stdout | default('(déjà changé ou secret supprimé)') }}"
      - "Accès : pas d'Ingress public. Argo CD détient les droits d'admin sur"
      - "les instances du groupe — il se joint par le VPN :"
      - "  ssh -L 8080:localhost:8080 {{ ansible_user }}@{{ wg_ip }}"
      - "  kubectl -n argocd port-forward svc/argocd-server 8080:443"
