---
# =============================================================================
# PHASE 2 — Infra Kubernetes : Argo CD du groupe
#
# S'applique à UNE machine par groupe (`<org>_argocd`).
#
# This role installs Argo CD and bootstraps it. It installs NEITHER
# cert-manager, NOR the ingress controller (ingress-nginx or Traefik), NOR a
# ClusterIssuer: Argo CD deploys all of them on the instances, from the
# Deploiment repo. Installing them here would create a duplicate conflicting
# with the AppSets (different versions, competing CRDs), which is exactly
# what used to go wrong.
# =============================================================================

# argon2: Deploiment's scripts/seal-secrets.sh, run on this machine, seals
# the admin account's password as an argon2id hash (MAIR-414) and falls back
# on the argon2 CLI when OpenSSL is older than 3.2 (Ubuntu 24.04 ships 3.0).
- name: Installer les dépendances du rôle
  ansible.builtin.apt:
    name: [git, curl, argon2]
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Argo CD ------------------------------------------------------------------

- name: Créer le namespace argocd
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ns_argocd
  changed_when: "'created' in ns_argocd.stdout"

- name: Installer Argo CD (version épinglée)
  ansible.builtin.command: >
    kubectl apply -n argocd --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

- name: Attendre la disponibilité d'Argo CD
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment --all
    -n argocd --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# With a checksum, get_url replaces the binary whenever it differs from the
# pinned release: a version bump also upgrades the CLI.
- name: Install the argocd CLI (pinned, sha256 verified; used by phase 3)
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    checksum: "sha256:https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/cli_checksums.txt"
    mode: "0755"

# --- Amorçage GitOps ----------------------------------------------------------

- name: Récupérer le dépôt Deploiment (pour platform-app.yaml)
  ansible.builtin.git:
    repo: "{{ deploiment_repo_url }}"
    dest: /opt/Deploiment
    version: "{{ deploiment_repo_branch }}"
    force: true

- name: Adapter platform-app.yaml au dépôt et à la branche déployés
  ansible.builtin.replace:
    path: /opt/Deploiment/bootstrap/platform-app.yaml
    regexp: "{{ item.re }}"
    replace: "{{ item.rep }}"
  loop:
    - { re: "repoURL: https://github.com/mairie360/Deploiment.git", rep: "repoURL: {{ deploiment_repo_url }}" }
    - { re: "targetRevision: main", rep: "targetRevision: {{ deploiment_repo_branch }}" }
  loop_control:
    label: "{{ item.re }}"

- name: Appliquer l'Application racine (socle du groupe)
  ansible.builtin.command: kubectl apply -n argocd -f /opt/Deploiment/bootstrap/platform-app.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: platform_apply
  changed_when: "'created' in platform_apply.stdout or 'configured' in platform_apply.stdout"

- name: Rendre l'ApplicationSet des instances du groupe
  ansible.builtin.template:
    src: instances-appset.yaml.j2
    dest: /opt/Deploiment/instances-appset.yaml
    mode: "0644"

# --- Image tags outside git (MAIR-186, MAIR-444) -----------------------------
# argocd-image-updater only writes to git now, and only for the environments
# of image_updater_policies. Before the ApplicationSet stops preserving the
# Applications' Helm parameters, delete the ImageUpdaters of the environments
# no longer followed (prod, client instances) and deal with the tags a former
# `argocd` write-back left in those parameters: they override values.yaml, so
# dropping them silently would roll an instance back to its pinned tags.

- name: List the ImageUpdaters on this machine
  ansible.builtin.command: >
    kubectl -n argocd get imageupdaters.argocd-image-updater.argoproj.io
    -o jsonpath={.items[*].metadata.name}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: imageupdaters_live
  changed_when: false
  # The CRD does not exist yet on a fresh machine: nothing to delete.
  failed_when: false

- name: Delete the ImageUpdaters of environments no longer followed
  ansible.builtin.command: >
    kubectl -n argocd delete imageupdaters.argocd-image-updater.argoproj.io {{ item }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop: >-
    {{ (imageupdaters_live.stdout.split() if imageupdaters_live.rc == 0 else [])
       | difference(groups[org_group ~ '_instances'] | default([])
                    | map('extract', hostvars, 'env_name')
                    | select('in', image_updater_policies.keys() | list) | list) }}
  changed_when: true

# Single-source Applications keep them in spec.source, the former
# multi-source layout (MAIR-173) in spec.sources[0].
- name: List the image tags left in instance Application parameters
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get applications.argoproj.io -o json | jq -c '
      [.items[]
       | select(any(.metadata.ownerReferences[]?; .kind == "ApplicationSet" and .name == "instances"))
       | if .spec.sources != null
         then {name: .metadata.name, path: "/spec/sources/0/helm/parameters", parameters: (.spec.sources[0].helm.parameters // [])}
         else {name: .metadata.name, path: "/spec/source/helm/parameters", parameters: (.spec.source.helm.parameters // [])}
         end
       | select(.parameters | length > 0)]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: leftover_parameters
  changed_when: false

- name: Report the image tags set outside git
  ansible.builtin.debug:
    msg:
      - "{{ item.name }} runs on tags written outside git by argocd-image-updater; they override its values:"
      - "{{ item.parameters | map(attribute='name') | zip(item.parameters | map(attribute='value')) | map('join', ' = ') | list }}"
  loop: "{{ leftover_parameters.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop until the leftover tags are pinned in Deploiment
  ansible.builtin.fail:
    msg: >-
      {{ (leftover_parameters.stdout | from_json) | map(attribute='name') | join(', ') }}
      still run on the image tags listed above. Pin the ones to keep in
      Deploiment (prod: clusters/_base/prod.yaml through a Promote; dev and
      staging: the git write-back commits the newest tags on its next pass),
      then re-run with -e image_updater_clear_parameters=true.
  when:
    - leftover_parameters.stdout | from_json | length > 0
    - not image_updater_clear_parameters | bool

- name: Remove the leftover image parameters
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - patch
      - applications.argoproj.io
      - "{{ item.name }}"
      - --type=json
      - -p
      - "{{ [{'op': 'remove', 'path': item.path}] | to_json }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop: "{{ leftover_parameters.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"
  when: image_updater_clear_parameters | bool
  changed_when: true

# This file scopes the Argo CD to `clusters/{{ org_id }}/instances/*`. It is
# not versioned in Deploiment because it depends on org_id: each group has its
# own, and no Argo CD sees another group's instances.
- name: Appliquer l'ApplicationSet des instances
  ansible.builtin.command: kubectl apply -n argocd -f /opt/Deploiment/instances-appset.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: appset_apply
  changed_when: "'created' in appset_apply.stdout or 'configured' in appset_apply.stdout"

# --- GHCR credentials (argocd/ghcr-secret) ------------------------------------
# argocd-image-updater reads the GHCR tags with pullsecret:argocd/ghcr-secret
# (Deploiment/bootstrap/appsets/image-updater-app.yaml). Nothing in Deploiment
# creates it: the token is not committable, even sealed (this machine has no
# sealed-secrets controller).

- name: Read the GHCR credentials already stored on this machine
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret ghcr-secret -o json 2>/dev/null \
      | jq -c '.data[".dockerconfigjson"] | @base64d | fromjson | .auths["ghcr.io"] | {username, password}' \
      || echo '{}'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ghcr_existing
  changed_when: false
  no_log: true

- name: Resolve the GHCR credentials (variables, else this machine)
  ansible.builtin.set_fact:
    ghcr_resolved_user: "{{ ghcr_user if ghcr_token | length > 0 else (ghcr_existing.stdout | from_json).username | default('', true) }}"
    ghcr_resolved_token: "{{ ghcr_token if ghcr_token | length > 0 else (ghcr_existing.stdout | from_json).password | default('', true) }}"
  no_log: true

- name: Ask for the GHCR user
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] GHCR user for ghcr-secret (read:packages token owner, empty to skip)"
  register: ghcr_user_prompt
  when:
    - secrets_prompt | bool
    - ghcr_resolved_token | length == 0

- name: Ask for the GHCR token
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] GHCR token (read:packages, hidden, empty to skip)"
    echo: false
  register: ghcr_token_prompt
  when:
    - secrets_prompt | bool
    - ghcr_resolved_token | length == 0
    - ghcr_user_prompt.user_input | default('') | length > 0
  no_log: true

- name: Keep the prompted GHCR credentials
  ansible.builtin.set_fact:
    ghcr_resolved_user: "{{ ghcr_user_prompt.user_input }}"
    ghcr_resolved_token: "{{ ghcr_token_prompt.user_input }}"
  when: ghcr_token_prompt.user_input | default('') | length > 0
  no_log: true

- name: Write argocd/ghcr-secret
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd create secret docker-registry ghcr-secret \
      --docker-server=ghcr.io \
      --docker-username="$GHCR_USER" --docker-password="$GHCR_TOKEN" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    GHCR_USER: "{{ ghcr_resolved_user }}"
    GHCR_TOKEN: "{{ ghcr_resolved_token }}"
  register: ghcr_apply
  changed_when: "'unchanged' not in ghcr_apply.stdout"
  when: ghcr_resolved_token | length > 0
  no_log: true

- name: Warn when no GHCR credentials are available
  ansible.builtin.debug:
    msg: >-
      No GHCR credentials (GHCR_USER / GHCR_TOKEN): argocd-image-updater cannot
      list tags, image tags will not be updated automatically.
  when: ghcr_resolved_token | length == 0

# --- Deploiment write credentials (argocd/deploiment-git-creds) ---------------
# Read by argocd-image-updater to commit the image tags of the environments of
# image_updater_policies (MAIR-444): a pull request on Deploiment main for
# dev, a direct commit on the staging branch for staging. Only asked when the
# group has such an environment.

- name: List the environments followed by argocd-image-updater
  ansible.builtin.set_fact:
    image_updater_git_envs: >-
      {{ groups[org_group ~ '_instances'] | default([])
         | map('extract', hostvars, 'env_name')
         | select('in', image_updater_policies.keys() | list)
         | list }}

- name: Read the Deploiment credentials already stored on this machine
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret deploiment-git-creds -o json 2>/dev/null \
      | jq -c '.data | {username: (.username | @base64d), password: (.password | @base64d)}' \
      || echo '{}'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: deploiment_git_existing
  changed_when: false
  no_log: true
  when: image_updater_git_envs | length > 0

- name: Resolve the Deploiment credentials (variables, else this machine)
  ansible.builtin.set_fact:
    deploiment_git_resolved_user: "{{ deploiment_git_user if deploiment_git_token | length > 0 else (deploiment_git_existing.stdout | from_json).username | default('', true) }}"
    deploiment_git_resolved_token: "{{ deploiment_git_token if deploiment_git_token | length > 0 else (deploiment_git_existing.stdout | from_json).password | default('', true) }}"
  no_log: true
  when: image_updater_git_envs | length > 0

- name: Ask for the Deploiment git user
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] Deploiment git user for the image tag commits ({{ image_updater_git_envs | join(', ') }}; empty to skip)"
  register: deploiment_git_user_prompt
  when:
    - image_updater_git_envs | length > 0
    - secrets_prompt | bool
    - deploiment_git_resolved_token | length == 0

- name: Ask for the Deploiment git token
  ansible.builtin.pause:
    prompt: "[{{ org_id }}] Deploiment token (contents + pull requests read/write, hidden, empty to skip)"
    echo: false
  register: deploiment_git_token_prompt
  when:
    - image_updater_git_envs | length > 0
    - secrets_prompt | bool
    - deploiment_git_resolved_token | length == 0
    - deploiment_git_user_prompt.user_input | default('') | length > 0
  no_log: true

- name: Keep the prompted Deploiment credentials
  ansible.builtin.set_fact:
    deploiment_git_resolved_user: "{{ deploiment_git_user_prompt.user_input }}"
    deploiment_git_resolved_token: "{{ deploiment_git_token_prompt.user_input }}"
  when: deploiment_git_token_prompt.user_input | default('') | length > 0
  no_log: true

- name: Write argocd/deploiment-git-creds
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd create secret generic deploiment-git-creds \
      --from-literal=username="$GIT_USER" --from-literal=password="$GIT_TOKEN" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    GIT_USER: "{{ deploiment_git_resolved_user }}"
    GIT_TOKEN: "{{ deploiment_git_resolved_token }}"
  register: deploiment_git_apply
  changed_when: "'unchanged' not in deploiment_git_apply.stdout"
  when:
    - image_updater_git_envs | length > 0
    - deploiment_git_resolved_token | length > 0
  no_log: true

- name: Warn when no Deploiment credentials are available
  ansible.builtin.debug:
    msg: >-
      No Deploiment credentials (DEPLOIMENT_GIT_USER / DEPLOIMENT_GIT_TOKEN):
      argocd-image-updater cannot commit the image tags of
      {{ image_updater_git_envs | join(', ') }}.
  when:
    - image_updater_git_envs | length > 0
    - deploiment_git_resolved_token | length == 0

# --- argocd-image-updater: one ImageUpdater per instance ----------------------
# The CRD is installed by the argocd-image-updater Application that
# platform-app has just started syncing: wait for it before applying.

- name: Wait for the ImageUpdater CRD
  ansible.builtin.command: >
    kubectl wait --for condition=established --timeout=30s
    crd/imageupdaters.argocd-image-updater.argoproj.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: imageupdater_crd
  changed_when: false
  retries: 30
  delay: 10
  until: imageupdater_crd.rc == 0

- name: Render the ImageUpdaters of the group
  ansible.builtin.template:
    src: image-updaters.yaml.j2
    dest: /opt/Deploiment/image-updaters.yaml
    mode: "0644"
  when: groups[org_group ~ '_instances'] | default([]) | length > 0

- name: Apply the ImageUpdaters of the group
  ansible.builtin.command: kubectl apply -f /opt/Deploiment/image-updaters.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: imageupdaters_apply
  changed_when: "'created' in imageupdaters_apply.stdout or 'configured' in imageupdaters_apply.stdout"
  when: groups[org_group ~ '_instances'] | default([]) | length > 0

# --- Output ------------------------------------------------------------------
# The admin password is never read into a variable nor printed: it would land
# in the terminal and in every saved run log. Only say whether the initial
# secret still exists and how to read it on the machine.

- name: Check whether the initial admin secret still exists
  ansible.builtin.command: kubectl -n argocd get secret argocd-initial-admin-secret -o name
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_initial_secret
  changed_when: false
  failed_when: false

- name: Show how to reach Argo CD
  ansible.builtin.debug:
    msg:
      - "Argo CD of group {{ org_id }} installed on {{ inventory_hostname }}."
      - "Initial admin password: {{ 'not printed, read it on the machine with:'
            if argocd_initial_secret.rc == 0
            else 'initial secret already deleted, use the password set after the first login.' }}"
      - "  sudo kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
      - "Then change it (argocd account update-password) and delete argocd-initial-admin-secret."
      - "Access: no public Ingress. Argo CD holds admin rights on the instances"
      - "of the group, it is reached through the VPN:"
      - "  ssh -L 8080:localhost:8080 {{ ansible_user }}@{{ wg_ip }}"
      - "  kubectl -n argocd port-forward svc/argocd-server 8080:443"
