# Images followed by argocd-image-updater in every instance of the group.
# `path` is the Helm values path of the instance in charts/mairie360-stack
# (APIs|BFFs|Fronts.instances.<key>, or the database / liquibase subchart,
# tracked like the others since MAIR-444). Keep in sync with the instance keys of
# Deploiment/clusters/*/instances/*/values.yaml.
# Note the project-front key vs projects-front image: the alias follows the
# key, the image follows the registry.
image_updater_services:
  - { alias: core-api,        image: ghcr.io/mairie360/core-api,            path: APIs.instances.core-api }
  - { alias: project-api,     image: ghcr.io/mairie360/project-api,         path: APIs.instances.project-api }
  - { alias: calendar-api,    image: ghcr.io/mairie360/calendar-api,        path: APIs.instances.calendar-api }
  - { alias: message-api,     image: ghcr.io/mairie360/message-api,         path: APIs.instances.message-api }
  - { alias: elearning-api,   image: ghcr.io/mairie360/elearning-api,       path: APIs.instances.elearning-api }
  - { alias: user-bff,        image: ghcr.io/mairie360/bff-user,            path: BFFs.instances.user-bff }
  - { alias: project-bff,     image: ghcr.io/mairie360/bff-project,         path: BFFs.instances.project-bff }
  - { alias: calendar-bff,    image: ghcr.io/mairie360/bff-calendar,        path: BFFs.instances.calendar-bff }
  - { alias: message-bff,     image: ghcr.io/mairie360/bff-message,         path: BFFs.instances.message-bff }
  - { alias: dashboard-bff,   image: ghcr.io/mairie360/bff-dashboard,       path: BFFs.instances.dashboard-bff }
  - { alias: settings-bff,    image: ghcr.io/mairie360/bff-settings,        path: BFFs.instances.settings-bff }
  - { alias: elearning-bff,   image: ghcr.io/mairie360/bff-elearning,       path: BFFs.instances.elearning-bff }
  - { alias: login-front,     image: ghcr.io/mairie360/login-front,         path: Fronts.instances.login-front }
  - { alias: project-front,   image: ghcr.io/mairie360/projects-front,      path: Fronts.instances.project-front }
  - { alias: calendar-front,  image: ghcr.io/mairie360/calendar-front,      path: Fronts.instances.calendar-front }
  - { alias: message-front,   image: ghcr.io/mairie360/message-front,       path: Fronts.instances.message-front }
  - { alias: dashboard-front, image: ghcr.io/mairie360/dashboard-front,     path: Fronts.instances.dashboard-front }
  - { alias: settings-front,  image: ghcr.io/mairie360/settings-front,      path: Fronts.instances.settings-front }
  - { alias: elearning-front, image: ghcr.io/mairie360/elearning-front,     path: Fronts.instances.elearning-front }
  - { alias: admin-front,     image: ghcr.io/mairie360/administrator-front, path: Fronts.instances.admin-front }
  # The Postgres server image (a new tag restarts the StatefulSet) and the
  # migrations, applied by the Liquibase Sync hook on the next sync.
  - { alias: database,        image: ghcr.io/mairie360/database,            path: database }
  - { alias: liquibase,       image: ghcr.io/mairie360/liquibase-migrations, path: liquibase }

# Environments followed by argocd-image-updater, by environment name
# (MAIR-415). An environment NOT listed gets no ImageUpdater: its images are
# exactly the tags pinned in its values.yaml in Deploiment, nothing else.
# That is the case of prod and of every client instance: their versions only
# change through a reviewed Deploiment commit promoted main -> staging ->
# prod, so a Promote rollback also rolls the images back.
#
# write_back:
#   argocd  the tag goes into the Application's Helm parameters, outside git.
#   git     the tag is committed to Deploiment (MAIR-444), into
#           clusters/<org>/instances/<env>/<target>. Needs
#           argocd/deploiment-git-creds (DEPLOIMENT_GIT_USER /
#           DEPLOIMENT_GIT_TOKEN, contents + pull requests write).
#           pull_request: true  a PR on deploiment_repo_branch (main), which
#             Deploiment's image-updater-automerge workflow squash-merges once
#             CI passes (dev: main is what dev follows).
#           pull_request: false  a direct commit on `branch`: staging's tags
#             go onto the `staging` branch, into images.yaml, a file main
#             never edits, so Promote can still merge main into staging (see
#             Deploiment docs/adr/0002-environment-promotion.md, amendment).
image_updater_policies:
  dev:
    strategy: newest-build
    allow_tags: "regexp:^dev-.*"
    write_back: git
    pull_request: true
    target: values.yaml
  staging:
    strategy: newest-build
    allow_tags: "regexp:^staging-.*"
    write_back: git
    pull_request: false
    branch: staging
    target: images.yaml

# Instance Applications without an `argocd` write-back keep the Helm
# parameters a former image-updater pass wrote there, and those override
# values.yaml. The role lists them; with true it also removes them, so the
# Application follows git again. Pin the listed tags in Deploiment first
# (prod), or let the git write-back catch up (dev, staging: the next pass
# commits the newest tags). Run once with true when switching an environment
# to `git` (MAIR-444).
image_updater_clear_parameters: false
