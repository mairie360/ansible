---
# =============================================================================
# PHASE 1 — Kubernetes prerequisites
#
# Identical on EVERY machine (Argo CD and instances alike): the base layer.
# What runs on top is decided by k8s_argocd / k8s_instance_link.
# =============================================================================

- name: Install the system packages
  ansible.builtin.apt:
    name: [curl, jq, ufw, fail2ban, chrony, unattended-upgrades, python3-yaml]
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Swap --------------------------------------------------------------------
# A small swap file is a safety net, not extra capacity: when memory runs out
# (for instance every pod restarting at once after a reboot) the kernel pages
# idle memory out instead of evicting the page cache until the machine stops
# answering (SSH banner timeouts, API server TLS handshake timeouts).
# k3s already starts the kubelet with --fail-swap-on=false. Pods only use the
# swap through the kubelet drop-in written with the k3s configuration below.
# node_swap_size_mb: 0 removes the swap instead.

- name: Create the swap file
  ansible.builtin.command: "fallocate -l {{ node_swap_size_mb }}M {{ node_swap_file }}"
  args:
    creates: "{{ node_swap_file }}"
  when: node_swap_size_mb | int > 0

- name: Restrict the swap file permissions
  ansible.builtin.file:
    path: "{{ node_swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when: node_swap_size_mb | int > 0

- name: Format the swap file
  community.general.filesystem:
    fstype: swap
    dev: "{{ node_swap_file }}"
  when: node_swap_size_mb | int > 0

- name: List the active swap areas
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: node_swap_active
  changed_when: false

- name: Enable the swap file
  ansible.builtin.command: "swapon {{ node_swap_file }}"
  when:
    - node_swap_size_mb | int > 0
    - node_swap_file not in node_swap_active.stdout_lines

- name: Mount the swap file at boot
  ansible.posix.mount:
    path: none
    src: "{{ node_swap_file }}"
    fstype: swap
    opts: sw
    state: present
  when: node_swap_size_mb | int > 0

- name: Prefer keeping memory over swapping (idle pages only)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/99-swap.conf
    reload: true
  when: node_swap_size_mb | int > 0

- name: Disable the swap
  ansible.builtin.command: swapoff -a
  when:
    - node_swap_size_mb | int == 0
    - ansible_swaptotal_mb | default(0) | int > 0

- name: Remove the swap from /etc/fstab
  ansible.posix.mount:
    path: none
    fstype: swap
    state: absent
  when: node_swap_size_mb | int == 0

# --- Firewall ----------------------------------------------------------------
# Architecture rule: only the fronts are exposed. On an instance, 80/443
# only. 22 and 6443 are reserved to the WireGuard tunnel.

- name: Default UFW policy — deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default UFW policy — allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Open the public ports of the machine's role
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ node_public_ports }}"

# SSH through the tunnel from the admin peers only (MAIR-415): the other
# machines of the group (a compromised dev, for instance) get no SSH on the
# Argo CD machine nor on each other. Admin traffic reaches the instances
# routed by the Argo CD machine, with its own source IP.
- name: Allow SSH through the tunnel from the admin peers
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: wg0
    direction: in
    from_ip: "{{ item.wg_ip }}"
    comment: "SSH from admin {{ item.name }}"
  loop: "{{ wireguard_admin_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the former SSH rule open to the whole tunnel
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: wg0
    direction: in
    delete: true

# The Argo CD of the group drives each instance through its API server, over
# the tunnel only (role k8s_instance_link registers https://<wg_ip>:6443).
# Restricted to the Argo CD machine's tunnel IP: 6443 is cluster-admin access.
- name: Allow the group's Argo CD to reach the API server through the tunnel
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    interface: wg0
    direction: in
    from_ip: "{{ hostvars[groups[org_group ~ '_argocd'][0]].wg_ip }}"
    comment: "k8s API from the group Argo CD"
  when: inventory_hostname in groups[org_group ~ '_instances'] | default([])

# Public SSH only during a bootstrap run (-e ssh_via_public_ip=true), which
# connects through the public IPs. A normal run connects through the tunnel,
# so removing the rule cannot lock Ansible out (MAIR-415).
- name: Open or close public SSH (open during a bootstrap run only)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "Public SSH - bootstrap only"
    delete: "{{ not (ssh_via_public_ip | bool) }}"

- name: Allow the k3s pod and service networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop:
    - "{{ k3s_cluster_cidr }}"
    - "{{ k3s_service_cidr }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

# --- sshd ----------------------------------------------------------------------
# Public key only, no root login (MAIR-415). A drop-in read before the image's
# own (50-cloud-init.conf...): for sshd the first value of a keyword wins.
# Validated with `sshd -t` before it replaces anything. Port forwarding stays
# allowed: it is how Argo CD's UI is reached (README).

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-mairie360.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # GENERATED BY ANSIBLE (role k8s_node) — do not edit by hand.
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      PermitEmptyPasswords no
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      maxretry = 3
      bantime  = 3600

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# --- k3s ---------------------------------------------------------------------

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Create the kubelet configuration drop-in directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/kubelet.conf.d
    state: directory
    mode: "0755"

# LimitedSwap lets each Burstable container use swap in proportion to its
# memory request (cgroup v2). The default, NoSwap, would keep every pod out of
# the swap file and leave it to the system daemons only. Without swap on the
# node (node_swap_size_mb: 0) the drop-in is removed and the kubelet keeps its
# defaults.
- name: Write the kubelet swap drop-in
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/kubelet.conf.d/10-swap.conf
    mode: "0644"
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      featureGates:
        NodeSwap: true
      memorySwap:
        swapBehavior: LimitedSwap
  when: node_swap_size_mb | int > 0
  notify: Restart k3s

- name: Remove the kubelet swap drop-in
  ansible.builtin.file:
    path: /etc/rancher/k3s/kubelet.conf.d/10-swap.conf
    state: absent
  when: node_swap_size_mb | int == 0
  notify: Restart k3s

# --- Secrets encryption at rest (MAIR-415) -------------------------------------
# `secrets-encryption: true` in the k3s configuration below encrypts every
# Secret from the first start of a new machine. A cluster started without it
# goes through the k3s migration instead (docs: "Enable Secrets Encryption on
# an Existing Cluster"): `enable` now, restart with the flag, then
# `rotate-keys` re-encrypts the existing Secrets (after the restart below).

- name: Read the secrets encryption status
  ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
  register: k3s_encryption_before
  changed_when: false
  failed_when: false

- name: Prepare secrets encryption on a cluster started without it
  ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt enable
  when:
    - k3s_encryption_before.rc == 0
    - "'no configuration file found' in k3s_encryption_before.stdout"
  register: k3s_encryption_enable
  changed_when: true
  notify: Restart k3s

- name: Write the k3s configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      # k3s's bundled Traefik disabled: the ingress controller (ingress-nginx
      # or, since MAIR-260, Traefik) is installed by Argo CD from Deploiment
      # (bootstrap/appsets/*), with its version pinned there instead of
      # following the k3s release. Which one runs is the cluster label
      # mairie360.fr/ingress (var ingress_controller). Two controllers
      # would fight over ports 80/443.
      #
      # flannel and the built-in network policy controller disabled: Cilium
      # is the CNI (tasks/cilium.yml). It enforces the NetworkPolicies itself
      # and Hubble makes every flow, and every drop, visible. Until Cilium is
      # installed the node stays NotReady: expected.
      #
      # ServiceLB stays ON: on a single node it is what binds the
      # LoadBalancer Service of the ingress controller to ports 80/443 of
      # the machine.
      # kube-proxy stays ON too: Cilium runs without kube-proxy replacement.
      disable:
        - traefik
      flannel-backend: none
      disable-network-policy: true
      write-kubeconfig-mode: "0600"
      # Secrets encrypted at rest (aescbc key generated by k3s under
      # /var/lib/rancher/k3s/server/cred/). See the tasks above for a
      # cluster started without it.
      secrets-encryption: true
      tls-san:
        # Required: without the WireGuard IP in the certificate, the Argo CD
        # of the group cannot reach this API server without a TLS error.
        - "{{ wg_ip }}"
        - "{{ inventory_hostname }}"
      # Kubelet configuration drop-ins (swap, see the tasks above).
      kubelet-arg:
        - "config-dir=/etc/rancher/k3s/kubelet.conf.d"
  notify: Restart k3s

# Installed and upgraded with the install.sh of the pinned tag (it verifies
# the binary's sha256 against the release). Idempotent: the installer only
# runs when the installed version differs from k3s_version.
- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

# "v1.35.8+k3s1" -> "1.35.8.1": comparable with the `version` test.
- name: Compare the installed k3s version with the pin
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_installed.stdout | default('') | regex_search('v[0-9]+[.][0-9]+[.][0-9]+[+]k3s[0-9]+') or '' }}"
    k3s_target_key: "{{ k3s_version | regex_replace('^v', '') | regex_replace('[+]k3s', '.') }}"

- name: Refuse a k3s downgrade or a skipped Kubernetes minor
  ansible.builtin.assert:
    that:
      - k3s_installed_key is version(k3s_target_key, '<=')
      - k3s_target_key.split('.')[0] == k3s_installed_key.split('.')[0]
      - (k3s_target_key.split('.')[1] | int) - (k3s_installed_key.split('.')[1] | int) <= 1
    fail_msg: >-
      {{ inventory_hostname }} runs k3s {{ k3s_installed_version }}, the pin is
      {{ k3s_version }}. Downgrades are refused, and Kubernetes upgrades one
      minor at a time: from v1.{{ k3s_installed_key.split('.')[1] }}, first run
      site.yml with -e k3s_version=<latest patch of
      v1.{{ (k3s_installed_key.split('.')[1] | int) + 1 }}>, then the next minor
      (README, "Upgrading k3s").
  vars:
    k3s_installed_key: "{{ k3s_installed_version | regex_replace('^v', '') | regex_replace('[+]k3s', '.') }}"
  when: k3s_installed_version | length > 0

- name: Download the k3s installer of the pinned release
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: "/usr/local/src/k3s-install-{{ k3s_version }}.sh"
    mode: "0755"
  when: k3s_installed_version != k3s_version

# One machine at a time: every machine is its own single-node cluster, so an
# upgrade restarts all of its pods. Upgrading sequentially keeps the other
# instances up (still, start with dev: --limit on its group).
- name: Install or upgrade k3s to the pinned release
  ansible.builtin.command: "/usr/local/src/k3s-install-{{ k3s_version }}.sh"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_installed_version != k3s_version
  throttle: 1
  changed_when: true

- name: Apply a k3s configuration change right away
  ansible.builtin.meta: flush_handlers

- name: Wait for the API server
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 5
    timeout: 180

# Second half of the migration: the server restarted with the flag, at stage
# `start`. rotate-keys generates the key and re-encrypts every Secret (about
# 5 per second), then a restart makes the new key the only one in use.
- name: Encrypt the existing Secrets
  when: k3s_encryption_enable is changed
  block:
    - name: Rotate the keys and re-encrypt the existing Secrets
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt rotate-keys
      changed_when: true

    - name: Wait for the re-encryption to finish
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: k3s_encryption_rotate
      changed_when: false
      retries: 60
      delay: 5
      until: "'reencrypt_finished' in k3s_encryption_rotate.stdout"

    - name: Restart k3s on the new key
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for the API server after the key rotation
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        delay: 5
        timeout: 180

- name: Read the final secrets encryption status
  ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
  register: k3s_encryption
  changed_when: false
  retries: 12
  delay: 5
  until: k3s_encryption.rc == 0

- name: Check that Secrets are encrypted at rest
  ansible.builtin.assert:
    that: "'Encryption Status: Enabled' in k3s_encryption.stdout"
    fail_msg: >-
      k3s reports secrets encryption is not enabled on {{ inventory_hostname }}:
      {{ k3s_encryption.stdout_lines | join(' | ') }}. See README, "Secrets
      encryption at rest".

- name: Create ~/.kube for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Link the kubeconfig for root
  ansible.builtin.file:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    state: link
    force: true

# --- CNI: Cilium + Hubble ------------------------------------------------------
# Needs the API server (above) and the kubeconfig. Ends with the node Ready.

- name: Install the CNI (Cilium) and Hubble
  ansible.builtin.include_tasks: cilium.yml
