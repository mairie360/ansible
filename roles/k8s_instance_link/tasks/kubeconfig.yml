---
# =============================================================================
# Kubeconfig of this instance on the group's Argo CD machine (MAIR-415).
#
# /root/.kube/instance-<env>.yaml used to be the k3s admin kubeconfig: a
# client certificate valid for a year that cannot be revoked, left on the
# Argo CD machine for every instance. It is now a ServiceAccount token
# (kube-system/mairie360-ops) that expires after instance_ops_token_duration.
# A later compromise of the Argo CD machine finds expired tokens only; the
# ServiceAccount itself can be deleted to cut every token at once.
#
# Used by phase 3 (argocd cluster add), phase 4 (k8s_instance_secrets) and
# verify.yml, which all include this file first:
#   include_role: { name: k8s_instance_link, tasks_from: kubeconfig }
#
# Argo CD itself never used this file: `argocd cluster add` creates its own
# kube-system/argocd-manager ServiceAccount and stores that token.
# =============================================================================

- name: Create the ops ServiceAccount
  ansible.builtin.shell: |
    set -o pipefail
    cat <<'MANIFEST' | kubectl apply -f -
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: mairie360-ops
      namespace: kube-system
    ---
    # cluster-admin: phase 4 restores the sealing keys in kube-system and
    # verify.sh reads every namespace of the instance.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: mairie360-ops
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - kind: ServiceAccount
        name: mairie360-ops
        namespace: kube-system
    MANIFEST
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ops_sa
  changed_when: "'created' in ops_sa.stdout or 'configured' in ops_sa.stdout"

- name: Issue a short-lived token for the ops ServiceAccount
  ansible.builtin.command: >
    kubectl -n kube-system create token mairie360-ops
    --duration={{ instance_ops_token_duration }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ops_token
  changed_when: false
  no_log: true

- name: Read the cluster CA of the instance
  ansible.builtin.command: >
    kubectl config view --raw
    -o jsonpath={.clusters[0].cluster.certificate-authority-data}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: instance_ca
  changed_when: false

# Server = the WireGuard IP (in the API certificate through k3s tls-san);
# context named after the environment, as `argocd cluster add` expects.
- name: Write the instance kubeconfig on the Argo CD machine
  ansible.builtin.copy:
    content: "{{ instance_ops_kubeconfig | to_nice_yaml }}"
    dest: "/root/.kube/instance-{{ env_name }}.yaml"
    owner: root
    group: root
    mode: "0600"
  vars:
    instance_ops_kubeconfig:
      apiVersion: v1
      kind: Config
      clusters:
        - name: "{{ env_name }}"
          cluster:
            server: "https://{{ wg_ip }}:6443"
            certificate-authority-data: "{{ instance_ca.stdout }}"
      users:
        - name: "{{ env_name }}"
          user:
            token: "{{ ops_token.stdout }}"
      contexts:
        - name: "{{ env_name }}"
          context:
            cluster: "{{ env_name }}"
            user: "{{ env_name }}"
      current-context: "{{ env_name }}"
  delegate_to: "{{ groups[org_group ~ '_argocd'][0] }}"
  diff: false
  no_log: true
