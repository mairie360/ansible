---
# =============================================================================
# PHASE 3 — Link
#
# Registers the instance with the Argo CD of ITS group, once Kubernetes is up
# on both sides.
#
# Two points that are not details:
#
# 1. The cluster is registered under the name `env_name` (dev / staging /
#    prod), exactly what the ApplicationSet expects in destination.name.
#    Any other name (the inventory_hostname, for instance) leaves the
#    Application stuck on "cluster does not exist", with no other symptom.
#
# 2. The registered address is the WireGuard IP, never the public IP. Port
#    6443 gives administrator access to the cluster: it has no business on
#    the Internet.
# =============================================================================

- name: Find the group's Argo CD machine
  ansible.builtin.set_fact:
    argocd_host: "{{ groups[org_group ~ '_argocd'][0] }}"
  tags: [labels]

# MAIR-260: a typo here would silently leave the machine on ingress-nginx
# (the AppSet treats anything but "traefik" as nginx).
- name: Check ingress_controller
  ansible.builtin.assert:
    that:
      - ingress_controller in ['nginx', 'traefik']
    fail_msg: >-
      ingress_controller must be "nginx" or "traefik" for
      {{ inventory_hostname }}, got "{{ ingress_controller }}".
  tags: [labels]

- name: Vérifier que le groupe a bien une machine Argo CD
  ansible.builtin.assert:
    that:
      - groups[org_group ~ '_argocd'] | default([]) | length == 1
    fail_msg: >-
      Le groupe '{{ org_id }}' doit déclarer exactement une machine dans
      '{{ org_id }}_argocd'. Trouvé :
      {{ groups[org_group ~ '_argocd'] | default([]) | length }}.

- name: Check that env_name is set
  ansible.builtin.assert:
    that:
      - env_name is defined
      - env_name | length > 0
    fail_msg: >-
      `env_name` must be set for {{ inventory_hostname }} and match a folder
      clusters/{{ org_id }}/instances/<env_name>/ of the Deploiment repo.

# The instances ApplicationSet only creates an Application for folders that
# exist on the tracked branch: without one, the instance is registered but
# nothing is ever deployed on it, with no error anywhere.
- name: Check that the instance values exist on the tracked Deploiment branch
  ansible.builtin.stat:
    path: "/opt/Deploiment/clusters/{{ org_id }}/instances/{{ env_name }}/values.yaml"
  delegate_to: "{{ argocd_host }}"
  register: instance_values

- name: Fail when the instance has no values.yaml
  ansible.builtin.assert:
    that: instance_values.stat.exists
    fail_msg: >-
      clusters/{{ org_id }}/instances/{{ env_name }}/values.yaml is missing on
      branch {{ deploiment_repo_branch }} of {{ deploiment_repo_url }}. Create
      and push it, then re-run site.yml (phase 2 refreshes the checkout).

# --- Instance kubeconfig on the Argo CD machine ------------------------------

- name: Write a short-lived kubeconfig of the instance on the Argo CD machine
  ansible.builtin.include_tasks: kubeconfig.yml

# --- Registration -------------------------------------------------------------

- name: Check Argo CD -> instance connectivity through the tunnel
  ansible.builtin.command: "kubectl --kubeconfig /root/.kube/instance-{{ env_name }}.yaml get --raw /readyz"
  delegate_to: "{{ argocd_host }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: instance_readyz
  changed_when: false
  retries: 10
  delay: 6
  until: instance_readyz.rc == 0

# Each name is decoded on its own: piping all of them to a single `base64 -d`
# breaks as soon as one of them carries padding.
- name: Check whether the cluster is already registered
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster -o json \
      | jq -r '.items[].data.name | @base64d' | grep -Fx '{{ env_name }}' || true
  args:
    executable: /bin/bash
  delegate_to: "{{ argocd_host }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cluster_already
  changed_when: false

# In --core mode the CLI looks for argocd-cm in the namespace of the current
# kubeconfig context, and k3s.yaml points at `default`: give it a copy whose
# context targets `argocd` (--port-forward-namespace has no effect here).
- name: Prepare a kubeconfig for the argocd CLI (context namespace = argocd)
  ansible.builtin.shell: |
    set -o pipefail
    cp /etc/rancher/k3s/k3s.yaml /root/.kube/argocd-cli.yaml
    chmod 600 /root/.kube/argocd-cli.yaml
    kubectl --kubeconfig /root/.kube/argocd-cli.yaml config set-context --current --namespace=argocd
  args:
    executable: /bin/bash
  delegate_to: "{{ argocd_host }}"
  changed_when: false

- name: Register the cluster with the group's Argo CD
  ansible.builtin.command: >
    argocd cluster add {{ env_name }}
    --kubeconfig /root/.kube/instance-{{ env_name }}.yaml
    --name {{ env_name }}
    --core --upsert --yes
  delegate_to: "{{ argocd_host }}"
  environment:
    KUBECONFIG: /root/.kube/argocd-cli.yaml
  when: cluster_already.stdout | trim != env_name
  changed_when: true

# These labels are what tell an instance apart from the Argo CD machine. The
# platform AppSets (sealed-secrets, cert-manager, cluster-issuer, ingress)
# select on mairie360.fr/role: without it they deploy nothing on this
# instance. mairie360.fr/ingress (MAIR-260) picks the ingress controller:
# Deploiment's traefik-appset.yaml takes "traefik", ingress-nginx-appset.yaml
# everything else. Flipping it makes Argo CD delete one controller and
# install the other (both AppSets carry the resources finalizer).
# Tagged `labels`: `site.yml --tags labels` re-applies them alone.
- name: Étiqueter le cluster comme instance du groupe
  ansible.builtin.shell: |
    set -o pipefail
    SECRET=$(kubectl -n argocd get secrets -l argocd.argoproj.io/secret-type=cluster \
      -o json | jq -r '.items[] | select((.data.name|@base64d)=="{{ env_name }}") | .metadata.name')
    [ -n "$SECRET" ] || { echo "secret de cluster introuvable"; exit 1; }
    kubectl -n argocd label secret "$SECRET" \
      mairie360.fr/role=instance \
      mairie360.fr/org={{ org_id }} \
      mairie360.fr/env={{ env_name }} \
      mairie360.fr/ingress={{ ingress_controller }} --overwrite
  args:
    executable: /bin/bash
  delegate_to: "{{ argocd_host }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: label_result
  changed_when: "'labeled' in label_result.stdout"
  tags: [labels]

- name: Récapitulatif
  ansible.builtin.debug:
    msg:
      - "{{ inventory_hostname }} est reliée à l'Argo CD de {{ org_id }}."
      - "Nom du cluster dans Argo CD : {{ env_name }} (via {{ wg_ip }}:6443)"
      - "Values attendues : clusters/{{ org_id }}/instances/{{ env_name }}/values.yaml"
      - "Secrets: phase 4 (role k8s_instance_secrets) seals them next."
