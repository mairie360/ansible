---
# Writes a kubeconfig for the ServiceAccount token Secret
# <github_runner_kc_sa_namespace>/<github_runner_sa_name>-token, read with
# <github_runner_admin_kubeconfig_path>. Inputs (set by the caller):
# github_runner_admin_kubeconfig_path, github_runner_kc_sa_namespace,
# github_runner_kc_dest, github_runner_kc_context, github_runner_kc_server,
# github_runner_kc_namespace, github_runner_kc_user.

- name: Wait for the ServiceAccount token ({{ github_runner_kc_dest }})
  ansible.builtin.command: >
    kubectl -n {{ github_runner_kc_sa_namespace }} get secret {{ github_runner_sa_name }}-token
    -o jsonpath={.data.token}
  environment:
    KUBECONFIG: "{{ github_runner_admin_kubeconfig_path }}"
  register: github_runner_sa_token_b64
  changed_when: false
  retries: 15
  delay: 2
  until: github_runner_sa_token_b64.stdout | length > 0
  no_log: true

- name: Read the cluster CA ({{ github_runner_kc_dest }})
  ansible.builtin.command: >
    kubectl -n {{ github_runner_kc_sa_namespace }} get secret {{ github_runner_sa_name }}-token
    -o jsonpath={.data.ca\.crt}
  environment:
    KUBECONFIG: "{{ github_runner_admin_kubeconfig_path }}"
  register: github_runner_sa_ca_b64
  changed_when: false

- name: Keep the token and CA ({{ github_runner_kc_dest }})
  ansible.builtin.set_fact:
    github_runner_sa_token: "{{ github_runner_sa_token_b64.stdout | b64decode }}"
    github_runner_sa_ca: "{{ github_runner_sa_ca_b64.stdout }}"
  no_log: true

# Readable by the runner, but owned by root: a job cannot rewrite it to point
# a later run at another server.
- name: Write the kubeconfig ({{ github_runner_kc_dest }})
  ansible.builtin.template:
    src: runner-kubeconfig.yaml.j2
    dest: "{{ github_runner_kc_dest }}"
    owner: root
    group: "{{ github_runner_user }}"
    mode: "0440"
  diff: false
  no_log: true
