---
# Writes a kubeconfig for the ServiceAccount token Secret
# <github_runner_kc_sa_namespace>/<github_runner_sa_name>-token, read with
# <github_runner_admin_kubeconfig_path>. Inputs (set by the caller):
# github_runner_admin_kubeconfig_path, github_runner_kc_sa_namespace,
# github_runner_kc_dest, github_runner_kc_context, github_runner_kc_server,
# github_runner_kc_namespace, github_runner_kc_user.

- name: Wait for the ServiceAccount token - {{ github_runner_kc_dest }}
  ansible.builtin.command: >
    kubectl -n {{ github_runner_kc_sa_namespace }} get secret {{ github_runner_sa_name }}-token
    -o jsonpath={.data.token}
  environment:
    KUBECONFIG: "{{ github_runner_admin_kubeconfig_path }}"
  register: github_runner_sa_token_b64
  changed_when: false
  retries: 15
  delay: 2
  until: github_runner_sa_token_b64.stdout | length > 0
  no_log: true

- name: Read the cluster CA - {{ github_runner_kc_dest }}
  ansible.builtin.command: >
    kubectl -n {{ github_runner_kc_sa_namespace }} get secret {{ github_runner_sa_name }}-token
    -o 'jsonpath={.data.ca\.crt}'
  environment:
    KUBECONFIG: "{{ github_runner_admin_kubeconfig_path }}"
  register: github_runner_sa_ca_b64
  changed_when: false

- name: Keep the token and CA - {{ github_runner_kc_dest }}
  ansible.builtin.set_fact:
    github_runner_sa_token: "{{ github_runner_sa_token_b64.stdout | b64decode }}"
    github_runner_sa_ca: "{{ github_runner_sa_ca_b64.stdout }}"
  no_log: true

# Readable by the runner, but owned by root: a job cannot rewrite it to point
# a later run at another server. Group-readable (0440), so the gh-runner group
# must stay single-member: any member could read the ServiceAccount token.
# Checked here, before the token is written.
- name: The gh-runner group has no member but gh-runner - {{ github_runner_kc_dest }}
  ansible.builtin.getent:
    database: group
    key: "{{ github_runner_user }}"

# Primary members (passwd GID) are not in the group's member list.
- name: Read the accounts and their primary group - {{ github_runner_kc_dest }}
  ansible.builtin.getent:
    database: passwd

- name: Fail when another account is in the gh-runner group - {{ github_runner_kc_dest }}
  ansible.builtin.assert:
    that:
      - github_runner_group_supplementary | length == 0
      - github_runner_group_primary | length == 0
    fail_msg: >-
      Accounts other than {{ github_runner_user }} are in its group
      ({{ (github_runner_group_supplementary + github_runner_group_primary) | unique | join(', ') }}):
      they could read the runner's ServiceAccount token. Remove them from the group.
  vars:
    github_runner_group_gid: "{{ ansible_facts.getent_group[github_runner_user][1] }}"
    github_runner_group_supplementary: >-
      {{ ansible_facts.getent_group[github_runner_user][2] | default('') | split(',')
         | reject('equalto', '') | reject('equalto', github_runner_user) | list }}
    github_runner_group_primary: >-
      {{ ansible_facts.getent_passwd | dict2items
         | selectattr('value.2', 'equalto', github_runner_group_gid)
         | map(attribute='key') | reject('equalto', github_runner_user) | list }}

- name: Write the kubeconfig - {{ github_runner_kc_dest }}
  ansible.builtin.template:
    src: runner-kubeconfig.yaml.j2
    dest: "{{ github_runner_kc_dest }}"
    owner: root
    group: "{{ github_runner_user }}"
    mode: "0440"
  diff: false
  no_log: true
