---
# =============================================================================
# The instance's secrets in the vault (MAIR-617)
#
# They are created by Terraform (mairie360/terraform, modules/instance), never
# by this role: a missing one stops the play before anything is sealed.
# Sets vault_ids {secret name: id}.
# =============================================================================

- name: List the instance's secrets in the vault
  ansible.builtin.uri:
    url: >-
      {{ vault_api_url }}/secrets?project_id={{ vault_auth.project_id
      }}&path={{ vault_path | urlencode }}&page_size=100
    headers:
      X-Auth-Token: "{{ vault_auth.secret_key }}"
    return_content: true
  delegate_to: localhost
  become: false
  register: vault_list
  no_log: true

- name: Map the instance's secrets in the vault
  ansible.builtin.set_fact:
    vault_ids: "{{ vault_list.json.secrets | vault_ids(vault_path, vault_entries.values() | list) }}"
  # Only ids, but built from a response the API key was sent for.
  no_log: true

- name: Fail when a secret of the instance is missing from the vault
  ansible.builtin.assert:
    that: vault_missing | length == 0
    quiet: true
    fail_msg: >-
      Secret Manager has no {{ vault_missing | join(', ') }} under {{ vault_path }}:
      run `terraform apply` in mairie360/terraform (orgs/{{ org_id }}) first.
      This role never creates them, and nothing is created by hand (MAIR-617).
  vars:
    vault_missing: "{{ vault_ids | vault_missing(vault_entries.values() | list) }}"
