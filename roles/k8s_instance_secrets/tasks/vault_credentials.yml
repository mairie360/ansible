---
# =============================================================================
# Credentials of the Secret Manager vault (MAIR-617), read on the controller
#
# The operator's own Scaleway credentials: environment first (scw_env), else
# the scw CLI profile (`scw init`). See defaults/main.yml for the order. Sets
# vault_auth {secret_key, project_id}.
# =============================================================================

- name: Check the scw CLI configuration
  ansible.builtin.stat:
    path: "{{ scw_config_file }}"
  delegate_to: localhost
  become: false
  register: scw_config_stat

- name: Read the scw CLI configuration
  ansible.builtin.slurp:
    src: "{{ scw_config_file }}"
  delegate_to: localhost
  become: false
  register: scw_config_raw
  when: scw_config_stat.stat.exists
  no_log: true

- name: Resolve the vault credentials
  ansible.builtin.include_tasks: vault_auth_resolve.yml
  vars:
    scw_config: >-
      {{ (scw_config_raw.content | b64decode | from_yaml)
         if scw_config_raw is not skipped else {} }}
