---
# =============================================================================
# PHASE 4 — Instance secrets
#
# Seals the Secrets of one instance with ITS sealed-secrets controller, by
# running Deploiment/scripts/seal-secrets.sh on the group's Argo CD machine:
# it is the only machine that reaches the instance API server (through the
# tunnel), the workstation does not.
#
#   1. waits for the sealed-secrets controller Argo CD deploys on the instance
#      (it needs the mairie360.fr/role=instance label set by phase 3);
#   2. resolves the external secrets (Resend, S3, backup bucket, Cockpit, GHCR) from
#      variables, else keeps what the instance already has, else prompts;
#      the admin account e-mail (MAIR-170) is resolved the same way but is
#      mandatory: the play fails if it is still empty after the prompt;
#      the Resend key is mandatory at the first sealing (MAIR-599);
#   3. resolves RESTIC_PASSWORD and the admin account's first ADMIN_PASSWORD
#      (instance, else the operator's backup file, else generated) and backs
#      their plaintext up on the operator's machine, in operator_backup_dir
#      (MAIR-599); fetches and deletes the admin password files an older run
#      of seal-secrets.sh left on the Argo CD machine;
#   4. runs seal-secrets.sh with them (the other generated secrets — JWT,
#      Postgres, Redis — are kept when they already exist on the instance,
#      never rotated here);
#   5. copies secrets.yaml back into the local Deploiment checkout, and the
#      instance sealing key into sealing_keys_dir.
#
# Committing and pushing secrets.yaml stays a manual step: Argo CD only
# deploys the secrets once it is on the tracked branch.
#
# Runs with `serial: 1` (playbooks/secrets.yml): prompts are then asked per
# instance, not once for the whole play.
# =============================================================================

- name: Resolve the group's Argo CD machine and the instance paths
  ansible.builtin.set_fact:
    argocd_host: "{{ groups[org_group ~ '_argocd'][0] }}"
    instance_kubeconfig: "/root/.kube/instance-{{ env_name }}.yaml"
    instance_ns: "mairie360-{{ env_name }}"
    instance_dir: "clusters/{{ org_id }}/instances/{{ env_name }}"

- name: Check that the local Deploiment checkout exists
  ansible.builtin.stat:
    path: "{{ deploiment_local_path }}/{{ instance_dir }}"
  delegate_to: localhost
  become: false
  register: local_instance_dir

- name: Fail when secrets.yaml cannot be copied back
  ansible.builtin.assert:
    that: local_instance_dir.stat.isdir | default(false)
    fail_msg: >-
      {{ deploiment_local_path }}/{{ instance_dir }} does not exist on this
      workstation. Clone Deploiment next to this repo or pass
      -e deploiment_local_path=<path to the Deploiment checkout>.

# --- kubeseal on the Argo CD machine -----------------------------------------

- name: Read the installed kubeseal version
  ansible.builtin.shell: kubeseal --version 2>/dev/null || true
  delegate_to: "{{ argocd_host }}"
  register: kubeseal_installed
  changed_when: false

- name: Install kubeseal (pinned, sha256 verified against the release)
  when: kubeseal_version not in kubeseal_installed.stdout
  delegate_to: "{{ argocd_host }}"
  block:
    - name: Download the kubeseal archive
      ansible.builtin.get_url:
        url: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
        dest: "/usr/local/src/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
        checksum: "sha256:https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/sealed-secrets_{{ kubeseal_version }}_checksums.txt"
        mode: "0644"

    - name: Install kubeseal into /usr/local/bin
      ansible.builtin.unarchive:
        src: "/usr/local/src/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubeseal]
        mode: "0755"

# --- Deploiment checkout and instance state ----------------------------------

- name: Refresh the Deploiment checkout on the Argo CD machine
  ansible.builtin.git:
    repo: "{{ deploiment_repo_url }}"
    dest: /opt/Deploiment
    version: "{{ deploiment_repo_branch }}"
    force: true
  delegate_to: "{{ argocd_host }}"

# Deployed by Argo CD (sealed-secrets-appset) once phase 3 labelled the
# cluster: on a fresh instance this takes a few minutes.
- name: Wait for the sealed-secrets controller on the instance
  ansible.builtin.command: >
    kubectl --kubeconfig {{ instance_kubeconfig }} -n kube-system
    rollout status deployment/sealed-secrets-controller --timeout=10s
  delegate_to: "{{ argocd_host }}"
  register: controller_ready
  changed_when: false
  retries: 60
  delay: 10
  until: controller_ready.rc == 0

- name: Read the instance values
  ansible.builtin.slurp:
    src: "/opt/Deploiment/{{ instance_dir }}/values.yaml"
  delegate_to: "{{ argocd_host }}"
  register: instance_values_raw

# Which external secrets already hold a value on the instance: seal-secrets.sh
# keeps those, so they are not asked again.
- name: Read which external secrets the instance already has
  ansible.builtin.shell: |
    set -o pipefail
    K="kubectl --kubeconfig {{ instance_kubeconfig }} -n {{ instance_ns }}"
    app=$($K get secret {{ env_name }}-app-secrets -o json 2>/dev/null || echo '{}')
    backup=$($K get secret {{ env_name }}-backup-secret -o name 2>/dev/null || true)
    cockpit=$($K get secret {{ env_name }}-cockpit-secret -o json 2>/dev/null || echo '{}')
    ghcr=$($K get secret ghcr-secret -o name 2>/dev/null || true)
    jq -cn --argjson app "$app" --arg backup "$backup" --argjson cockpit "$cockpit" --arg ghcr "$ghcr" '{
      resend_api_key: (($app.data.SMTP_PASSWORD // "") != ""),
      s3_access_key:  (($app.data.S3_ACCESS_KEY // "") != ""),
      s3_secret_key:  (($app.data.S3_SECRET_KEY // "") != ""),
      backup_access_key_id:     ($backup != ""),
      backup_secret_access_key: ($backup != ""),
      cockpit_token: (($cockpit.data.COCKPIT_TOKEN // "") != ""),
      ghcr: ($ghcr != "")
    }'
  args:
    executable: /bin/bash
  delegate_to: "{{ argocd_host }}"
  register: on_cluster_raw
  changed_when: false

- name: Resolve the external secrets from variables
  ansible.builtin.set_fact:
    on_cluster: "{{ on_cluster_raw.stdout | from_json }}"
    backup_enabled: "{{ ((instance_values_raw.content | b64decode | from_yaml).backup | default({})).enabled | default(false) | bool }}"
    observability_enabled: "{{ (((instance_values_raw.content | b64decode | from_yaml).global | default({})).observability | default({})).enabled | default(false) | bool }}"
    resolved_secrets: >-
      {{ resolved_secrets | default({}) | combine({
           item.key: (instance_secrets[inventory_hostname] | default({}))[item.key]
                     | default(lookup('ansible.builtin.env', item.value), true)
         }) }}
  loop: "{{ instance_secret_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# MAIR-599: the generated values this role backs up, and whether this is the
# first sealing. Unlike the read above, a kubectl error fails the play
# instead of reading as "absent": an absent RESTIC_PASSWORD gets generated,
# and a new one would make every existing backup unreadable.
- name: Read the generated secrets already sealed on the instance
  ansible.builtin.shell: |
    set -euo pipefail
    K="kubectl --kubeconfig {{ instance_kubeconfig }} -n {{ instance_ns }}"
    backup=$($K get secret {{ env_name }}-backup-secret -o json --ignore-not-found)
    db=$($K get secret {{ env_name }}-database-secret -o json --ignore-not-found)
    keycloak=$($K get secret {{ env_name }}-keycloak-secret -o name --ignore-not-found)
    [ -n "$backup" ] || backup='{}'
    [ -n "$db" ] || db='{}'
    jq -cn --argjson backup "$backup" --argjson db "$db" --arg keycloak "$keycloak" '{
      restic_password: (($backup.data.RESTIC_PASSWORD // "") | @base64d),
      admin_password:  (($db.data.ADMIN_PASSWORD // "") | @base64d),
      keycloak_secret: ($keycloak != "")
    }'
  args:
    executable: /bin/bash
  delegate_to: "{{ argocd_host }}"
  register: generated_on_cluster_raw
  changed_when: false
  no_log: true

- name: Keep the generated secrets already sealed on the instance
  ansible.builtin.set_fact:
    generated_on_cluster:
      restic_password: "{{ (generated_on_cluster_raw.stdout | from_json).restic_password }}"
      admin_password: "{{ (generated_on_cluster_raw.stdout | from_json).admin_password }}"
    keycloak_on_cluster: "{{ (generated_on_cluster_raw.stdout | from_json).keycloak_secret }}"
  no_log: true

# --- Prompts -----------------------------------------------------------------
# Only for what is neither provided nor already on the instance. The backup
# bucket keys are only asked when backup.enabled is true in the instance
# values, the Cockpit token when global.observability.enabled is (MAIR-131:
# to seal it before enabling, pass COCKPIT_TOKEN or instance_secrets instead).
# Leave a prompt empty to skip it: seal-secrets.sh then seals the key empty
# and verify.yml reports it. Except the Resend key at the first sealing
# (MAIR-599, tasks/check_first_sealing.yml): the play then fails.

- name: Ask for the missing external secrets
  ansible.builtin.pause:
    prompt: >-
      [{{ inventory_hostname }}] {{ item.label }}
      ({{ 'hidden, MANDATORY at the first sealing'
          if item.key == 'resend_api_key' and not keycloak_on_cluster | bool
          else 'hidden, empty to skip' }})
    echo: false
  register: secret_prompts
  loop:
    - { key: resend_api_key, label: "Resend API key (SMTP_PASSWORD of core-api)" }
    - { key: s3_access_key, label: "Object Storage access key (S3_ACCESS_KEY of elearning-api)" }
    - { key: s3_secret_key, label: "Object Storage secret key (S3_SECRET_KEY of elearning-api)" }
    - { key: backup_access_key_id, label: "Backup bucket access key (AWS_ACCESS_KEY_ID)" }
    - { key: backup_secret_access_key, label: "Backup bucket secret key (AWS_SECRET_ACCESS_KEY)" }
    - { key: cockpit_token, label: "Scaleway Cockpit token, push metrics + push traces (COCKPIT_TOKEN)" }
  loop_control:
    label: "{{ item.key }}"
  when:
    - secrets_prompt | bool
    - resolved_secrets[item.key] | length == 0
    - not on_cluster[item.key]
    - backup_enabled | bool or not item.key.startswith('backup_')
    - observability_enabled | bool or item.key != 'cockpit_token'
  # The registered results hold what was typed.
  no_log: true

- name: Keep the prompted secrets
  ansible.builtin.set_fact:
    resolved_secrets: "{{ resolved_secrets | combine({item.item.key: item.user_input}) }}"
  loop: "{{ secret_prompts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.user_input | default('') | length > 0
  no_log: true

# --- Admin account e-mail (MAIR-170) ------------------------------------------
# Unlike the secrets above: prompted in clear (not hidden, not sensitive) and
# mandatory — no instance should keep Database's public template admin
# account by accident, so an empty value here fails the play instead of being
# sealed empty. seal-secrets.sh still keeps whatever ADMIN_EMAIL it already
# has sealed when run by hand without this role, but this role never checks
# that: it always resolves its own value or stops.

- name: Ask for the admin account e-mail
  ansible.builtin.pause:
    prompt: "[{{ inventory_hostname }}] Town hall administrator e-mail (ADMIN_EMAIL)"
  register: admin_email_prompt
  when:
    - secrets_prompt | bool
    - resolved_secrets.admin_email | length == 0

- name: Keep the prompted admin account e-mail
  ansible.builtin.set_fact:
    resolved_secrets: "{{ resolved_secrets | combine({'admin_email': admin_email_prompt.user_input}) }}"
  when:
    - admin_email_prompt is not skipped
    - admin_email_prompt.user_input | length > 0
  # resolved_secrets holds the other secrets too.
  no_log: true

- name: Fail when the admin account e-mail is missing
  ansible.builtin.assert:
    that: resolved_secrets.admin_email | length > 0
    fail_msg: >-
      No admin account e-mail for {{ inventory_hostname }} (MAIR-170): set
      instance_secrets[{{ inventory_hostname }}].admin_email, export
      ADMIN_EMAIL, or answer the prompt above. seal-secrets.sh needs it to
      replace Database's public template admin account.

- name: Require the Resend API key at the first sealing (MAIR-599)
  ansible.builtin.include_tasks: check_first_sealing.yml

# --- GHCR pull secret ----------------------------------------------------------
# seal-secrets.sh only writes ghcr-secret when GHCR_TOKEN is set: without it,
# a ghcr-secret sealed earlier would disappear from secrets.yaml and be pruned.
# Same credentials as argocd/ghcr-secret, written by phase 2.

- name: Read the GHCR credentials of the Argo CD machine
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret ghcr-secret -o json 2>/dev/null \
      | jq -c '.data[".dockerconfigjson"] | @base64d | fromjson | .auths["ghcr.io"] | {username, password}' \
      || echo '{}'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ argocd_host }}"
  register: ghcr_argocd
  changed_when: false
  when: ghcr_token | length == 0
  no_log: true

- name: Resolve the GHCR credentials
  ansible.builtin.set_fact:
    ghcr_seal_user: "{{ ghcr_user if ghcr_token | length > 0 else (ghcr_argocd.stdout | default('{}') | from_json).username | default('', true) }}"
    ghcr_seal_token: "{{ ghcr_token if ghcr_token | length > 0 else (ghcr_argocd.stdout | default('{}') | from_json).password | default('', true) }}"
  no_log: true

- name: Stop before dropping the instance's existing ghcr-secret
  ansible.builtin.assert:
    that: ghcr_seal_token | length > 0 or not on_cluster.ghcr
    fail_msg: >-
      {{ instance_ns }} has a ghcr-secret but no GHCR credentials are known
      (GHCR_USER / GHCR_TOKEN unset, no argocd/ghcr-secret): sealing now would
      remove it. Export GHCR_USER / GHCR_TOKEN or re-run site.yml (phase 2 asks).

# --- Generated secrets backed up on the operator's machine (MAIR-599) ---------
# RESTIC_PASSWORD (losing it = every backup unreadable) and the admin
# account's first ADMIN_PASSWORD (the instance only gets its argon2id hash)
# are resolved here and passed to seal-secrets.sh, so that the value sealed
# is exactly the one backed up in operator_backup_dir. See
# tasks/resolve_generated.yml for the order (instance, file, generated).

- name: Create the operator's backup directory
  ansible.builtin.file:
    path: "{{ operator_backup_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# Before MAIR-599 this role let seal-secrets.sh generate ADMIN_PASSWORD,
# which wrote the plaintext on the Argo CD machine
# (/root/.mairie360/admin-<org>-<env>.txt, older ones renamed with a date
# suffix). Bring them to the operator's machine, then delete them there.
- name: Find admin password files left on the Argo CD machine
  ansible.builtin.find:
    paths: /root/.mairie360
    patterns: "admin-{{ org_id }}-{{ env_name }}.txt*"
  delegate_to: "{{ argocd_host }}"
  register: admin_leftovers

- name: Check which admin password files already exist on the operator's machine
  ansible.builtin.stat:
    path: "{{ operator_backup_dir }}/{{ item.path | basename }}"
  loop: "{{ admin_leftovers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost
  become: false
  register: admin_leftovers_local

# An existing local file is never overwritten: the copy gets a suffix.
- name: Fetch the admin password files to the operator's machine
  ansible.builtin.fetch:
    src: "{{ item.item.path }}"
    dest: >-
      {{ operator_backup_dir }}/{{ item.item.path | basename }}{{
         ('.from-' ~ argocd_host) if item.stat.exists else '' }}
    flat: true
  loop: "{{ admin_leftovers_local.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  delegate_to: "{{ argocd_host }}"
  register: admin_leftovers_fetched
  no_log: true

- name: Restrict the fetched admin password files to the operator
  ansible.builtin.file:
    path: "{{ item.dest }}"
    mode: "0600"
  loop: "{{ admin_leftovers_fetched.results | default([]) }}"
  loop_control:
    label: "{{ item.dest | basename }}"
  delegate_to: localhost
  become: false

- name: Delete the admin password files from the Argo CD machine
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ admin_leftovers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: "{{ argocd_host }}"

- name: Check the operator's backup files
  ansible.builtin.stat:
    path: "{{ operator_backup_dir }}/{{ item.value }}-{{ org_id }}-{{ env_name }}.txt"
  loop: "{{ generated_backup_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  register: generated_backup_stats

- name: Read the operator's backup files
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ generated_backup_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  delegate_to: localhost
  become: false
  register: generated_backup_reads
  no_log: true

- name: Keep the contents of the operator's backup files
  ansible.builtin.set_fact:
    generated_backups: >-
      {{ {'restic_password': '', 'admin_password': ''}
         | combine(dict(generated_backup_reads.results
                        | map(attribute='item.item.key')
                        | zip(generated_backup_reads.results
                              | map(attribute='content') | map('b64decode') | map('trim')))) }}
  no_log: true

- name: Resolve RESTIC_PASSWORD and ADMIN_PASSWORD
  ansible.builtin.include_tasks: resolve_generated.yml

# Before sealing: a value sealed but not backed up would be lost. A backup
# file holding another value than the instance is kept with a date suffix.
- name: Back up the generated secrets on the operator's machine
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ operator_backup_dir }}/{{ generated_backup_files[item.key] }}-{{ org_id }}-{{ env_name }}.txt"
    mode: "0600"
    backup: true
  loop: "{{ generated_backup_writes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  diff: false
  no_log: true

# --- Sealing -------------------------------------------------------------------

- name: Seal the instance secrets (Deploiment/scripts/seal-secrets.sh)
  ansible.builtin.command:
    cmd: "./scripts/seal-secrets.sh {{ env_name }} {{ org_id }} {{ env_name }} {{ seal_extra_args }}"
    chdir: /opt/Deploiment
  environment:
    # Context named after the environment by phase 3 (k8s_instance_link).
    KUBECONFIG: "{{ instance_kubeconfig }}"
    RESEND_API_KEY: "{{ resolved_secrets.resend_api_key }}"
    S3_ACCESS_KEY: "{{ resolved_secrets.s3_access_key }}"
    S3_SECRET_KEY: "{{ resolved_secrets.s3_secret_key }}"
    AWS_ACCESS_KEY_ID: "{{ resolved_secrets.backup_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ resolved_secrets.backup_secret_access_key }}"
    COCKPIT_TOKEN: "{{ resolved_secrets.cockpit_token }}"
    ADMIN_EMAIL: "{{ resolved_secrets.admin_email }}"
    # MAIR-599: always set, so seal-secrets.sh never generates them itself.
    RESTIC_PASSWORD: "{{ generated_seal.restic_password }}"
    ADMIN_PASSWORD: "{{ generated_seal.admin_password }}"
    GHCR_USER: "{{ ghcr_seal_user }}"
    GHCR_TOKEN: "{{ ghcr_seal_token }}"
  delegate_to: "{{ argocd_host }}"
  register: seal_run
  changed_when: seal_run.rc == 0
  failed_when: false
  # The environment holds the secrets; the script output does not.
  no_log: true

- name: Show the seal-secrets.sh output
  ansible.builtin.debug:
    msg: "{{ seal_run.stdout_lines + seal_run.stderr_lines }}"

- name: Fail when sealing failed
  ansible.builtin.assert:
    that: seal_run.rc == 0
    fail_msg: "seal-secrets.sh exited with {{ seal_run.rc }}, see its output above."

- name: Copy secrets.yaml back into the local Deploiment checkout
  ansible.builtin.fetch:
    src: "/opt/Deploiment/{{ instance_dir }}/secrets.yaml"
    dest: "{{ deploiment_local_path }}/{{ instance_dir }}/secrets.yaml"
    flat: true
  delegate_to: "{{ argocd_host }}"

# --- Sealing key backup ------------------------------------------------------
# Losing this key makes every committed secrets.yaml of the instance
# undecryptable after a reinstall.

- name: Read the instance sealing key
  ansible.builtin.command: >
    kubectl --kubeconfig {{ instance_kubeconfig }} -n kube-system get secret
    -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml
  delegate_to: "{{ argocd_host }}"
  register: sealing_key
  changed_when: false
  no_log: true

- name: Create the local sealing key directory
  ansible.builtin.file:
    path: "{{ sealing_keys_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Back up the sealing key on the workstation
  ansible.builtin.copy:
    content: "{{ sealing_key.stdout }}\n"
    dest: "{{ sealing_keys_dir }}/{{ org_id }}-{{ env_name }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  diff: false
  no_log: true

# --- Summary -------------------------------------------------------------------

- name: Missing external secrets
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ item }} is empty, see the seal-secrets.sh output above."
  loop: >-
    {{ (['resend_api_key', 's3_access_key', 's3_secret_key'] + (['cockpit_token'] if observability_enabled | bool else []))
       | reject('in', on_cluster | dict2items | selectattr('value') | map(attribute='key') | list)
       | select('in', resolved_secrets | dict2items | rejectattr('value') | map(attribute='key') | list)
       | list }}

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Secrets of {{ org_id }}/{{ env_name }} sealed."
      - "RESTIC_PASSWORD ({{ generated_sources.restic_password }}): {{ restic_file }} (store it in the team vault)"
      - "{{ admin_first_login_line[generated_sources.admin_password] }}"
      - "Written: {{ deploiment_local_path }}/{{ instance_dir }}/secrets.yaml"
      - "Sealing key: {{ sealing_keys_dir }}/{{ org_id }}-{{ env_name }}.yaml (store it in the team vault)"
      - "Argo CD deploys them once pushed to {{ deploiment_repo_branch }}:"
      - "  cd {{ deploiment_local_path }} && git add {{ instance_dir }}/secrets.yaml && git commit -m 'chore({{ env_name }}): seal secrets' && git push"
      - "{{ env_name }} follows the branch {{ deploiment_env_revisions[env_name] | default(deploiment_repo_branch) }}: unless that is {{ deploiment_repo_branch }}, promote the commit with the Promote workflow of Deploiment."
  vars:
    admin_file: "{{ operator_backup_dir }}/admin-{{ org_id }}-{{ env_name }}.txt"
    restic_file: "{{ operator_backup_dir }}/restic-{{ org_id }}-{{ env_name }}.txt"
    admin_first_login_line:
      cluster: "ADMIN_PASSWORD: argon2id hash kept from the instance; its plaintext is in {{ admin_file }} if a previous run backed it up"
      cluster-plaintext: "ADMIN_PASSWORD: plaintext sealed before MAIR-414, now sealed as its hash; plaintext backed up in {{ admin_file }}"
      backup: "ADMIN_PASSWORD (first login of the admin account): from {{ admin_file }}"
      generated: "ADMIN_PASSWORD (first login of the admin account): generated, in {{ admin_file }} (store it in the team vault)"
