# External secrets of each instance, the ones seal-secrets.sh cannot
# generate. Resolved in this order, per instance:
#   1. instance_secrets[<inventory_hostname>].<key>, e.g. from an
#      ansible-vault file passed with -e @secrets.yml (gitignored):
#        instance_secrets:
#          mairie360-dev:
#            resend_api_key: re_xxx
#            s3_access_key: SCWxxx
#            s3_secret_key: xxx
#            backup_access_key_id: xxx        # only when backup.enabled
#            backup_secret_access_key: xxx
#            cockpit_token: xxx               # MAIR-131, only when observability.enabled
#            admin_email: admin@example.org   # MAIR-170, mandatory
#   2. the environment variable of the controller (same for every instance):
#      RESEND_API_KEY, S3_ACCESS_KEY, S3_SECRET_KEY, AWS_ACCESS_KEY_ID,
#      AWS_SECRET_ACCESS_KEY, COCKPIT_TOKEN, ADMIN_EMAIL;
#   3. for resend_api_key and cockpit_token, the vault (MAIR-803,
#      vault_external_keys): a value passed in 1. or 2. is stored there, so it
#      is typed once and CI runs need nothing;
#   4. the value already sealed on the instance (kept by seal-secrets.sh);
#   5. an interactive prompt (secrets_prompt, inventory/group_vars/all.yml).
#
# admin_email (MAIR-170, the town hall administrator account's e-mail) is
# different from the others: it is prompted in clear, not hidden, and is
# mandatory — an empty value fails the play instead of being sealed empty,
# so no instance starts on Database's public template admin account by
# accident. Its step 4 is the ADMIN_EMAIL already sealed on the instance
# (MAIR-803: a CI run keeps it), read by this role. The matching first ADMIN_PASSWORD is generated by this role and
# stored in the vault, see vault_entries below.
instance_secrets: {}

instance_secret_env:
  resend_api_key: RESEND_API_KEY
  s3_access_key: S3_ACCESS_KEY
  s3_secret_key: S3_SECRET_KEY
  backup_access_key_id: AWS_ACCESS_KEY_ID
  backup_secret_access_key: AWS_SECRET_ACCESS_KEY
  cockpit_token: COCKPIT_TOKEN
  admin_email: ADMIN_EMAIL

# Where the generated secrets.yaml is copied back: the Deploiment checkout
# next to this repo (Devops/ansible + Devops/Deploiment).
deploiment_local_path: "{{ playbook_dir }}/../../Deploiment"

# --- Vault: Scaleway Secret Manager (MAIR-617) --------------------------------
# What exists nowhere but on the instance is kept in Secret Manager, never on
# the workstation:
#   restic-password  RESTIC_PASSWORD of the backup bucket: losing it (and the
#                    instance or its sealing key) makes every backup unreadable;
#   admin-password   plaintext first password of the town hall admin account
#                    (MAIR-170); the instance only gets its argon2id hash
#                    (MAIR-414);
#   sealing-keys     the keys of the instance's sealed-secrets controller, one
#                    version per key (description = the key's Secret name):
#                    the controller no longer renews its key (Deploiment,
#                    keyrenewperiod "0"), so one version per instance unless a
#                    key is rotated on purpose; a bundle of keys in a single
#                    version would outgrow Secret Manager's 64 KiB. Without them, a reinstall makes every committed
#                    secrets.yaml of the instance undecryptable.
# The secrets themselves are created by Terraform (mairie360/Infra,
# modules/instance), never by hand and never by this role: the role only adds
# versions, and fails when a secret is missing.
vault_region: fr-par
vault_api_url: "https://api.scaleway.com/secret-manager/v1beta1/regions/{{ vault_region }}"
# Same path as modules/instance of mairie360/Infra.
vault_path: "/{{ org_id }}/{{ env_name }}"
# Secret names, same as modules/instance of mairie360/Infra.
vault_entries:
  restic_password: restic-password
  admin_password: admin-password
  sealing_keys: sealing-keys
  # MAIR-803: external values, read when not passed (so that a CI run needs
  # nothing typed), stored when passed. Their keys are vault_external_keys.
  resend_api_key: resend-api-key
  cockpit_token: cockpit-token
# Values read from the vault by tasks/vault_read.yml (sealing keys apart).
vault_value_keys: [restic_password, admin_password, resend_api_key, cockpit_token]
# External secrets (instance_secret_env keys) the vault keeps (MAIR-803).
vault_external_keys: [resend_api_key, cockpit_token]
# Versions Secret Manager keeps per secret, disabled ones included (Scaleway
# quota, same at both account tiers; Support can raise it). The role checks it
# before writing. The sealed-secrets controller no longer renews its key
# (Deploiment bootstrap/addons/sealed-secrets, keyrenewperiod "0"), so
# sealing-keys normally holds one version per instance.
vault_max_versions: 20

# Credentials of the vault, read on the controller, in this order:
#   1. vault_project_id (inventory), else SCW_DEFAULT_PROJECT_ID, else the
#      scw CLI profile; SCW_SECRET_KEY, else the scw CLI profile;
#   2. the scw CLI profile is SCW_PROFILE, else active_profile, else the top
#      level of scw_config_file (`scw init` writes it).
# scw_config_file is found like the scw CLI does: SCW_CONFIG_PATH, else
# $XDG_CONFIG_HOME/scw/config.yaml, else ~/.config/scw/config.yaml.
vault_project_id: ""
scw_env:
  secret_key: "{{ lookup('ansible.builtin.env', 'SCW_SECRET_KEY') }}"
  project_id: "{{ lookup('ansible.builtin.env', 'SCW_DEFAULT_PROJECT_ID') }}"
  profile: "{{ lookup('ansible.builtin.env', 'SCW_PROFILE') }}"
  config_path: "{{ lookup('ansible.builtin.env', 'SCW_CONFIG_PATH') }}"
  xdg_config_home: "{{ lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') }}"
  home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
scw_config_file: >-
  {{ scw_env.config_path
     or ((scw_env.xdg_config_home or (scw_env.home ~ '/.config')) ~ '/scw/config.yaml') }}

# --- Local backups of MAIR-599, migrated then deleted (MAIR-617) --------------
# Before MAIR-617 the role kept restic-<org>-<env>.txt, admin-<org>-<env>.txt
# (and their `.from-<host>` / `.<pid>.<date>~` copies) in this directory, and
# the sealing key in sealing-keys/<org>-<env>.yaml. Every run uploads what it
# finds there for its own instance, reads it back from the vault, then deletes
# the file. Nothing is written there any more.
legacy_backup_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.mairie360"
legacy_sealing_keys_dir: "{{ legacy_backup_dir }}/sealing-keys"

# Legacy file prefix of each generated secret, in legacy_backup_dir.
generated_backup_files:
  restic_password: restic
  admin_password: admin

# Extra arguments for seal-secrets.sh. Generated secrets are kept by default;
# "--rotate-roles" regenerates only the API Postgres role passwords (applied
# by the next Liquibase sync), "--rotate" regenerates everything else that
# seal-secrets.sh generates (read its warnings first: superuser) EXCEPT
# RESTIC_PASSWORD and ADMIN_PASSWORD: this role always passes those in, and
# seal-secrets.sh uses a value passed in even with --rotate (MAIR-599).
seal_extra_args: ""
