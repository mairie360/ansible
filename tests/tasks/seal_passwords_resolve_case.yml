---
# One case of tests/seal_passwords_test.yml: resolves the generated secrets
# from `case` and checks the result.
- name: "Resolve the generated secrets: {{ case.name }}"
  ansible.builtin.include_tasks: ../../roles/k8s_instance_secrets/tasks/resolve_generated.yml
  vars:
    generated_on_cluster: "{{ case.cluster }}"
    generated_backups: "{{ case.backup }}"

- name: "Check the resolved values: {{ case.name }}"
  ansible.builtin.assert:
    that:
      - generated_sources == case.sources
      - case.seal.restic_password is not defined or generated_seal.restic_password == case.seal.restic_password
      - case.seal.admin_password is not defined or generated_seal.admin_password == case.seal.admin_password
      - generated_seal.restic_password is match('^[0-9a-f]{64}$') or case.sources.restic_password != 'generated'
      - generated_seal.admin_password is match('^[0-9a-f]{64}$') or case.sources.admin_password != 'generated'
      - generated_backup_writes.restic_password == generated_seal.restic_password
      - >-
        (generated_backup_writes.admin_password | default('<none>'))
        == (generated_seal.admin_password if case.backs_up_admin else '<none>')
    fail_msg: >-
      {{ case.name }}: sources {{ generated_sources | to_json }},
      sealed {{ generated_seal | to_json }}, backed up {{ generated_backup_writes | to_json }}
