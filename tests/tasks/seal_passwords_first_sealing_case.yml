---
# One case of tests/seal_passwords_test.yml: runs the first-sealing check
# with the facts of `case` and checks whether it stops the play.
- name: "Run the first-sealing check: {{ case.name }}"
  block:
    - name: "Check the Resend key: {{ case.name }}"
      ansible.builtin.include_tasks: ../../roles/k8s_instance_secrets/tasks/check_first_sealing.yml
      vars:
        keycloak_on_cluster: "{{ case.keycloak }}"
        on_cluster: {resend_api_key: "{{ case.smtp_on_cluster }}"}
        resolved_secrets: {resend_api_key: "{{ case.resend }}"}

    - name: "Record that it passed: {{ case.name }}"
      ansible.builtin.set_fact:
        first_sealing_failed: false
  rescue:
    - name: "Record that it failed: {{ case.name }}"
      ansible.builtin.set_fact:
        first_sealing_failed: true

- name: "Check the outcome: {{ case.name }}"
  ansible.builtin.assert:
    that: first_sealing_failed == case.fails
    fail_msg: "{{ case.name }}: failed={{ first_sealing_failed }}, expected {{ case.fails }}"
