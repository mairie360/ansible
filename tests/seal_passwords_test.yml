---
# Non-regression test of MAIR-599, on localhost, no machine touched:
#
#   ansible-playbook tests/seal_passwords_test.yml
#
# Role k8s_instance_secrets must:
#   - resolve RESTIC_PASSWORD and ADMIN_PASSWORD itself, the value sealed on
#     the instance winning over the operator's backup file, the file over a
#     new value, and NEVER replace a value the instance already has (a new
#     RESTIC_PASSWORD makes every backup unreadable);
#   - store the plaintexts in the vault, never the admin hash, and write
#     no file on the operator's machine (MAIR-617, tests/vault_test.yml);
#   - pass both to seal-secrets.sh, so it generates neither itself (it used to
#     generate them, back up neither, and leave the admin plaintext on the
#     Argo CD machine);
#   - stop a first sealing without a Resend API key (Keycloak imports its
#     SMTP settings once).
- name: MAIR-599 generated secrets and first sealing
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_name: dev
    sealed_restic: "1111111111111111111111111111111111111111111111111111111111111111"
    backed_up_restic: "2222222222222222222222222222222222222222222222222222222222222222"
    sealed_hash: "$argon2id$v=19$m=19456,t=2,p=1$c2FsdHNhbHQ$aGFzaGhhc2hoYXNoaGFzaA"
    backed_up_admin: "3333333333333333333333333333333333333333333333333333333333333333"
    legacy_admin: "legacy-plaintext-admin-password"
    resolve_cases:
      - name: the instance wins over a different backup file
        cluster: {restic_password: "{{ sealed_restic }}", admin_password: "{{ sealed_hash }}"}
        backup: {restic_password: "{{ backed_up_restic }}", admin_password: "{{ backed_up_admin }}"}
        sources: {restic_password: cluster, admin_password: cluster}
        seal: {restic_password: "{{ sealed_restic }}", admin_password: "{{ sealed_hash }}"}
        # The vault gets the instance's restic value; for the admin account,
        # the known plaintext stays the current version, never the hash
        # (CodeRabbit on ansible#61: an older copy must not become current).
        stores_admin: "{{ backed_up_admin }}"
      - name: the instance's values are kept without any backup file
        cluster: {restic_password: "{{ sealed_restic }}", admin_password: "{{ sealed_hash }}"}
        backup: {restic_password: "", admin_password: ""}
        sources: {restic_password: cluster, admin_password: cluster}
        seal: {restic_password: "{{ sealed_restic }}", admin_password: "{{ sealed_hash }}"}
        stores_admin: <none>
      - name: a plaintext admin password sealed before MAIR-414 is kept and backed up
        cluster: {restic_password: "{{ sealed_restic }}", admin_password: "{{ legacy_admin }}"}
        backup: {restic_password: "", admin_password: "{{ backed_up_admin }}"}
        sources: {restic_password: cluster, admin_password: cluster-plaintext}
        seal: {restic_password: "{{ sealed_restic }}", admin_password: "{{ legacy_admin }}"}
        stores_admin: sealed
      - name: the backup file wins over a new value (re-run before the first sync)
        cluster: {restic_password: "", admin_password: ""}
        backup: {restic_password: "{{ backed_up_restic }}", admin_password: "{{ backed_up_admin }}"}
        sources: {restic_password: backup, admin_password: backup}
        seal: {restic_password: "{{ backed_up_restic }}", admin_password: "{{ backed_up_admin }}"}
        stores_admin: sealed
      - name: new hex values are generated and backed up on a new instance
        cluster: {restic_password: "", admin_password: ""}
        backup: {restic_password: "", admin_password: ""}
        sources: {restic_password: generated, admin_password: generated}
        seal: {}
        stores_admin: sealed
    first_sealing_cases:
      - {name: first sealing without a Resend key fails, keycloak: false, smtp_on_cluster: false, resend: "", fails: true}
      - {name: first sealing with a Resend key passes, keycloak: false, smtp_on_cluster: false, resend: re_xxx, fails: false}
      - {name: first sealing keeping a sealed Resend key passes, keycloak: false, smtp_on_cluster: true, resend: "", fails: false}
      - {name: a later sealing without a Resend key passes, keycloak: true, smtp_on_cluster: false, resend: "", fails: false}
  tasks:
    - name: Resolve the generated secrets
      ansible.builtin.include_tasks: tasks/seal_passwords_resolve_case.yml
      loop: "{{ resolve_cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Two runs generate two different values
      block:
        - name: Generate once
          ansible.builtin.include_tasks: ../roles/k8s_instance_secrets/tasks/resolve_generated.yml
          vars:
            generated_on_cluster: {restic_password: "", admin_password: ""}
            generated_backups: {restic_password: "", admin_password: ""}

        - name: Keep the first generated values
          ansible.builtin.set_fact:
            first_generated: "{{ generated_seal }}"

        - name: Generate again
          ansible.builtin.include_tasks: ../roles/k8s_instance_secrets/tasks/resolve_generated.yml
          vars:
            generated_on_cluster: {restic_password: "", admin_password: ""}
            generated_backups: {restic_password: "", admin_password: ""}

        - name: The values are random, not a constant
          ansible.builtin.assert:
            that:
              - generated_seal.restic_password != first_generated.restic_password
              - generated_seal.admin_password != first_generated.admin_password
              - generated_seal.restic_password != generated_seal.admin_password

    - name: Check the first-sealing rule
      ansible.builtin.include_tasks: tasks/seal_passwords_first_sealing_case.yml
      loop: "{{ first_sealing_cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Read the role's tasks
      ansible.builtin.set_fact:
        role_tasks: "{{ lookup('ansible.builtin.file', '../roles/k8s_instance_secrets/tasks/main.yml') | from_yaml }}"

    # MAIR-617: nothing secret is written on the workstation any more. The
    # only local file tasks left delete the copies of MAIR-599. Module keys
    # are read with a loop: selectattr('ansible.builtin.copy') would look for
    # a nested `ansible` key and never match (CodeRabbit on ansible#61).
    - name: The role writes no file on the workstation
      ansible.builtin.assert:
        that: local_writes | length == 0
        fail_msg: "{{ local_writes | to_json }}"
      vars:
        writers: [copy, template, fetch, lineinfile, blockinfile, get_url, unarchive, file]
        modules: "{{ writers + writers | map('regex_replace', '^', 'ansible.builtin.') | list }}"
        local_tasks: >-
          {{ role_tasks | selectattr('delegate_to', 'defined')
             | selectattr('delegate_to', 'equalto', 'localhost') | list }}
        local_writes: >-
          {%- set out = [] -%}
          {%- for task in local_tasks -%}
            {%- for module, args in task.items() if module in modules -%}
              {%- if not (module in ['file', 'ansible.builtin.file'] and args is mapping
                          and args.state | default('') == 'absent') -%}
                {%- set _ = out.append(task.name) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    # Static: the sealing itself needs a cluster.
    - name: The role passes RESTIC_PASSWORD and ADMIN_PASSWORD to seal-secrets.sh
      ansible.builtin.assert:
        that:
          - seal.environment.RESTIC_PASSWORD is search('generated_seal\\.restic_password')
          - seal.environment.ADMIN_PASSWORD is search('generated_seal\\.admin_password')
          - names.index('Require the Resend API key at the first sealing (MAIR-599)') < names.index(seal.name)
          - names.index('Resolve RESTIC_PASSWORD and ADMIN_PASSWORD') < names.index(seal.name)
          # MAIR-617: stored in the vault (and read back) before sealing, and
          # the earlier copies deleted only after that.
          - names.index('Find the instance\'s secrets in the vault') < names.index('Resolve RESTIC_PASSWORD and ADMIN_PASSWORD')
          - names.index('Store the generated secrets in the vault') < names.index(seal.name)
          - names.index('Store the generated secrets in the vault') < names.index('Delete the local backup files of MAIR-599, now in the vault')
          - names.index('Store the generated secrets in the vault') < names.index('Delete the admin password files from the Argo CD machine')
          - names.index('Delete the admin password files from the Argo CD machine') < names.index(seal.name)
          - names.index('Store the new sealing keys in the vault') < names.index('Delete the local sealing key backup of MAIR-599, now in the vault')
          # MAIR-803: the external secrets fall back on the vault (read
          # first), are sealed from resolved_secrets, and a value passed this
          # run is stored with the generated ones, before sealing.
          - names.index('Read the vault values (generated and external secrets)') < names.index(resolve.name)
          - names.index('Read the admin account e-mail sealed on the instance') < names.index(resolve.name)
          - resolve['ansible.builtin.set_fact'].resolved_secrets is search('resolve_external_secrets')
          - seal.environment.RESEND_API_KEY is search('resolved_secrets\\.resend_api_key')
          - seal.environment.COCKPIT_TOKEN is search('resolved_secrets\\.cockpit_token')
          - plan.vars.external_vault_finals is search('vault_external_finals')
          - plan['ansible.builtin.set_fact'].vault_writes is search('combine\\(external_vault_finals\\)')
          - names.index(plan.name) < names.index('Store the generated secrets in the vault')
          - (role_tasks | selectattr('name', 'equalto', 'Read the admin account e-mail sealed on the instance') | first).no_log
        fail_msg: "{{ seal | to_json }}"
      vars:
        names: "{{ role_tasks | map(attribute='name') | list }}"
        seal: "{{ role_tasks | selectattr('name', 'match', 'Seal the instance secrets') | first }}"
        resolve: "{{ role_tasks | selectattr('name', 'match', 'Resolve the external secrets') | first }}"
        plan: "{{ role_tasks | selectattr('name', 'equalto', 'Plan the versions of the generated secrets') | first }}"
