# Static checks of the repository: no public IP address in a tracked file (MAIR-708),
# image-updater templates (MAIR-186, MAIR-444), ansible-lint, no secret logged, the
# instance secrets rules and the followed images against Deploiment (MAIR-599),
# no secret in new commits (MAIR-677), the promotion runner (MAIR-346), the
# Secret Manager vault of the instance secrets (MAIR-617).
name: Checks

on:
  pull_request:
  # Every branch: a public address pushed before any pull request exists is reported too.
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    # MAIR-677: this repository is public. Gitleaks (default rules) fails this
    # job when a new commit adds a secret. It runs after the push, so it never
    # refuses the push: it fails the check on the push and on the pull request.
    # A pull request is blocked from merging only when branch protection
    # requires `secret-scan`. Ansible Vault ciphertext is not reported.
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The shared action trusts the scanned checkout's .gitleaks.toml and
      # .gitleaksignore, so a pull request could allowlist its own secret.
      # This repository needs neither (the default rules let vault ciphertext
      # through): adding one fails here and needs this workflow changed too.
      - name: No Gitleaks override in the repository
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then
              echo "::error file=$f::$f would let a commit silence the secret scan (MAIR-677)"
              exit 1
            fi
          done
      - name: Run Gitleaks on the new commits
        uses: mairie360/CICD/actions/security/gitleaks@v5.2.2
      - name: Check the scan rules (blocks tokens and keys, lets vault ciphertext through)
        run: bash tests/mair_677_secret_scan_test.sh

  no-public-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No public IP in tracked files
        run: python3 tests/check_no_public_ip.py

  image-updater:
    # MAIR-186 / MAIR-444: prod gets no ImageUpdater, dev and staging write their tags to git.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core
        run: pipx install ansible-core==2.20.7
      - name: Render the image-updater templates
        run: ansible-playbook tests/image_updater_test.yml

  github-runner:
    # MAIR-346: bootstrap revision annotation, the promotion runner's RBAC,
    # admission policy and network sandbox.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core
        run: pipx install ansible-core==2.20.7
      - name: Render the runner and revision templates
        run: ansible-playbook tests/github_runner_test.yml

  ansible-lint:
    # MAIR-599. Pre-existing violations: .ansible-lint / .ansible-lint-ignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core and ansible-lint
        # Outside the checkout, so that ansible-lint does not scan the venv.
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install ansible-core==2.20.7 ansible-lint==26.9.0
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Lint
        run: ansible-lint

  no-log:
    # MAIR-599: tasks handling secrets set no_log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install pyyaml==6.0.3
      - name: No secret logged
        run: '"$RUNNER_TEMP/py/bin/python" tests/check_no_log.py'

  instance-secrets:
    # MAIR-599: RESTIC_PASSWORD / ADMIN_PASSWORD resolution and backup, Resend key
    # mandatory at the first sealing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core
        run: pipx install ansible-core==2.20.7
      - name: Test the generated secrets and the first sealing
        run: ansible-playbook tests/seal_passwords_test.yml

  image-updater-services:
    # MAIR-599: image_updater_services follows exactly the services Deploiment deploys.
    # The chart declares none (APIs|BFFs|Fronts.instances are empty): they are the keys of
    # clusters/*/instances/*/values.yaml, so the check reads Deploiment's main (public
    # repository) rather than the chart alone. A failure here after a Deploiment change
    # means this repository has to follow it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Deploiment (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mairie360/Deploiment
          ref: main
          path: deploiment
          persist-credentials: false
          sparse-checkout: |
            clusters
            charts/mairie360-stack/values.yaml
          sparse-checkout-cone-mode: false
      - name: Install PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install pyyaml==6.0.3
      - name: Followed images match the deployed services
        run: '"$RUNNER_TEMP/py/bin/python" tests/check_image_updater_services.py deploiment'

  vault:
    # MAIR-617: the instance secrets live in Scaleway Secret Manager. The
    # filters are unit-tested, then the role's vault tasks run against a local
    # stand-in of the API (no Scaleway account used).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-core and PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install ansible-core==2.20.7 pyyaml==6.0.3
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Unit tests of the vault filters
        run: python -m unittest tests/test_vault_filters.py -v
      - name: Vault tasks against the stand-in Secret Manager
        run: ansible-playbook tests/vault_test.yml
